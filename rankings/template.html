// ---------------------------------------------------------------- basketball: schedule, scoring, daily projections
//
// Basketball lineups are set every day, so a basketball "period" is a date and a week's score is the
// sum of each day's best lineup among players whose team plays that day. Points come from stat lines
// scored with the league's own settings (the boards use ESPN's standard points).

const CAL = PD.calendar || {weeks: {}, games: {}};
const TODAY = D.today || new Date().toISOString().slice(0, 10);
const GAMEDAY = {};   // team -> {date: [opponent, home]}
Object.entries(CAL.games || {}).forEach(([team, list]) => { GAMEDAY[team] = Object.fromEntries(list.map(g => [g[0], [g[1], g[2]]])); });
const FI = Object.fromEntries(FIELDS.map((f, i) => [f, i]));   // stat line index (basketball)
let LG = null;   // the league being shown; projections are scored with its settings

function addDays(iso, n) { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
function datesBetween(a, b) { const out = []; for (let d = a; d <= b; d = addDays(d, 1)) out.push(d); return out; }

const SCORING_CACHE = new WeakMap();
function nbaPoints(line, scoring) {
  if (!line) return 0;
  scoring = scoring || D.scoring || {};
  let terms = SCORING_CACHE.get(scoring);
  if (!terms) {
    const v = k => line => line[FI[k]] || 0;
    const derived = {
      fgmi: l => (l[FI.fga] || 0) - (l[FI.fgm] || 0), ftmi: l => (l[FI.fta] || 0) - (l[FI.ftm] || 0),
      tpmi: l => (l[FI.tpa] || 0) - (l[FI.tpm] || 0), dreb: l => (l[FI.reb] || 0) - (l[FI.oreb] || 0),
      bonus_pt_40p: l => (l[FI.pts] >= 40 ? 1 : 0), bonus_pt_50p: l => (l[FI.pts] >= 50 ? 1 : 0),
      bonus_reb_20p: l => (l[FI.reb] >= 20 ? 1 : 0), bonus_ast_15p: l => (l[FI.ast] >= 15 ? 1 : 0),
    };
    terms = Object.entries(scoring).filter(([k, w]) => w && (k in FI || k in derived)).map(([k, w]) => [w, k in FI ? v(k) : derived[k]]);
    SCORING_CACHE.set(scoring, terms);
  }
  let s = 0;
  for (const [w, f] of terms) s += w * f(line);
  return s;
}

const gamesOf = team => CAL.games[team] || [];
const nextGameDate = (team, from = TODAY) => (gamesOf(team).find(g => g[0] >= from) || [])[0] || null;

function nbaProj(pl, date, applyInjury) {
  const p = P[pl.sid];
  if (!p || !(GAMEDAY[p.t] || {})[date]) return 0;
  const cache = LG ? (LG._fp = LG._fp || new Map()) : null;
  const key = `${pl.sid}|${date}|${applyInjury ? pl.inj || '' : ''}`;
  if (cache && cache.has(key)) return cache.get(key);
  let pts = nbaPoints(p.nx[date] || p.pg, LG ? LG.scoring : D.scoring) * liveLeft(p.t, date);
  if (applyInjury && pl.inj) {
    const d = injuryDetail(pl.sid, pl.inj) || p.inj;
    if (['Out', 'Sus', 'IR'].includes(pl.inj)) { if (!(d && d.ret && date >= d.ret)) pts = 0; }
    else if (d && d.play != null && date === nextGameDate(p.t)) pts *= d.play / 100;
  }
  if (cache) cache.set(key, pts);
  return pts;
}

// Weeks and periods, the same calls for both sports.
const curWeek = L => (NBA ? (L.curWeek || D.week) : D.week);
const lastDone = L => curWeek(L) - 1;
function periodsOf(L, w) { return NBA ? (L.weekDates[w] || []).filter(d => d >= TODAY) : [w]; }
function weekTotal(L, team, w) {
  const now = w === curWeek(L);
  return periodsOf(L, w).reduce((s, p) => s + bestLineup(L, team, p, now).total, 0);
}
/** Periods used to value a roster: through Week 17 in football, the next four weeks of games in basketball. */
function sampleOf(L) {
  if (L._sample) return L._sample;
  if (!NBA) return (L._sample = {periods: ROS_WEEKS, weeks: ROS_WEEKS.length, now: p => p === D.week});
  const end = addDays(TODAY, 27);
  const dates = [...new Set(Object.values(L.weekDates).flat())].filter(d => d >= TODAY && d <= end).sort();
  const weekEnd = (L.weekDates[curWeek(L)] || [TODAY]).slice(-1)[0];
  return (L._sample = {periods: dates, weeks: 4, now: d => d <= weekEnd});
}

const ESPN_NBA_SLOTS = {0: 'PG', 1: 'SG', 2: 'SF', 3: 'PF', 4: 'C', 5: 'G', 6: 'F', 7: 'SG/SF', 8: 'G/F', 9: 'PF/C', 10: 'F/C', 11: 'UTIL'};
const ESPN_NBA_TEAMS = {1: 'ATL', 2: 'BOS', 3: 'NOP', 4: 'CHI', 5: 'CLE', 6: 'DAL', 7: 'DEN', 8: 'DET', 9: 'GSW', 10: 'HOU', 11: 'IND',
  12: 'LAC', 13: 'LAL', 14: 'MIA', 15: 'MIL', 16: 'MIN', 17: 'BKN', 18: 'NYK', 19: 'ORL', 20: 'PHI', 21: 'PHX', 22: 'POR', 23: 'SAC',
  24: 'SAS', 25: 'OKC', 26: 'UTA', 27: 'WAS', 28: 'TOR', 29: 'MEM', 30: 'CHA'};
// ESPN basketball stat ids used in league scoring settings.
const ESPN_NBA_STATS = {0: 'pts', 1: 'blk', 2: 'stl', 3: 'ast', 4: 'oreb', 5: 'dreb', 6: 'reb', 11: 'to', 13: 'fgm', 14: 'fga',
  15: 'ftm', 16: 'fta', 17: 'tpm', 18: 'tpa', 23: 'fgmi', 24: 'ftmi', 25: 'tpmi', 37: 'dd', 38: 'td'};
const ESPN_NBA_INJ = {OUT: 'Out', DAY_TO_DAY: 'DTD', QUESTIONABLE: 'Questionable', DOUBTFUL: 'Doubtful', PROBABLE: 'Probable',
  SUSPENSION: 'Sus', INJURY_RESERVE: 'Out'};

function parseEspnNba(raw, myTeam) {
  const settings = raw.settings || {};
  const counts = (settings.rosterSettings || {}).lineupSlotCounts || {};
  const slots = [];
  for (let id = 0; id <= 11; id++) for (let i = 0; i < (counts[id] || 0); i++) slots.push(ESPN_NBA_SLOTS[id]);
  const members = Object.fromEntries((raw.members || []).map(m => [m.id, m.displayName]));
  const teams = (raw.teams || []).map(t => {
    const players = [], current = [];
    ((t.roster || {}).entries || []).forEach(e => {
      const info = (e.playerPoolEntry || {}).player || {};
      const sid = PD.keys[normName(info.fullName || '')] || null;
      const el = (info.eligibleSlots || []).filter(s => s <= 4).map(s => ESPN_NBA_SLOTS[s]);
      const known = sid && P[sid];
      const pl = {sid, name: known ? P[sid].n : (info.fullName || `Player #${e.playerId}`),
                  pos: (el[0] || (known && P[sid].p) || ''), el: el.length ? el : (known ? P[sid].el : []),
                  team: known ? P[sid].t : (ESPN_NBA_TEAMS[info.proTeamId] || ''),
                  inj: ESPN_NBA_INJ[info.injuryStatus] || (known ? P[sid].i : null)};
      players.push(pl);
      const slot = ESPN_NBA_SLOTS[e.lineupSlotId];
      if (slot) current.push({slot, pl});
    });
    const pool = current.slice();
    const aligned = slots.map(slot => { const i = pool.findIndex(c => c.slot === slot); return {slot, pl: i >= 0 ? pool.splice(i, 1)[0].pl : null}; });
    const owner = members[t.primaryOwner] || members[(t.owners || [])[0]] || '';
    return {id: t.id, name: t.name || `${t.location || ''} ${t.nickname || ''}`.trim() || `Team ${t.id}`, owner, players, current: aligned};
  });
  const scoring = {};
  (((settings.scoringSettings || {}).scoringItems) || []).forEach(i => { const k = ESPN_NBA_STATS[i.statId]; if (k) scoring[k] = (scoring[k] || 0) + i.points; });
  const sched = settings.scheduleSettings || {};
  const periods = sched.matchupPeriods || {};
  const dateOf = sp => (D.espn_periods || {})[String(sp)];
  const weekDates = Object.fromEntries(Object.entries(periods).map(([mp, sps]) => [mp, sps.map(dateOf).filter(Boolean).sort()]));
  const regPeriods = sched.matchupPeriodCount || Math.max(0, ...(raw.schedule || []).map(m => m.matchupPeriodId));
  const regWeeks = []; for (let mp = 1; mp <= regPeriods; mp++) regWeeks.push(mp);
  const schedule = (raw.schedule || []).filter(m => m.home && m.away && m.away.teamId != null && m.matchupPeriodId <= regPeriods)
    .map(m => ({week: m.matchupPeriodId, a: m.home.teamId, b: m.away.teamId, ap: m.home.totalPoints || 0, bp: m.away.totalPoints || 0}));
  const cur = regWeeks.find(w => (weekDates[w] || []).slice(-1)[0] >= TODAY) || regPeriods + 1;
  return {platform: 'ESPN', name: settings.name || `ESPN league ${raw.id}`, slots, teams, schedule, regWeeks,
          playoffTeams: sched.playoffTeamCount || 4, myTeam, scoring: Object.keys(scoring).length ? scoring : D.scoring,
          weekDates, curWeek: cur};
}

// ---------------------------------------------------------------- leagues: projections, lineups, simulation

function proj(pl, week, applyInjury) {
  if (!pl || !pl.sid || !P[pl.sid]) return 0;
  if (NBA) return nbaProj(pl, week, applyInjury);
  if (applyInjury && UNAVAILABLE.has(pl.inj)) return 0;
  // Once this week's games start, only the part of a player's game still to play counts.
  return (P[pl.sid].proj[String(week)] || 0) * (week === D.week ? liveLeft(P[pl.sid].t) : 1);
}

/** Best lineup for one period (a football week, a basketball day): fill the most restrictive slots first
 *  with the highest projections. ptsFn replaces the projection, e.g. to rank by season-long value. */
function bestLineup(L, team, week, applyInjury, ptsFn) {
  const order = L._order || (L._order = L.slots.map((slot, i) => ({slot, i})).filter(s => SLOT_ELIG[s.slot])
    .sort((x, y) => SLOT_ELIG[x.slot].length - SLOT_ELIG[y.slot].length || x.i - y.i));
  const used = new Set();
  const picks = new Array(L.slots.length).fill(null);
  const pts = team.players.map(pl => (ptsFn ? ptsFn(pl) : proj(pl, week, applyInjury)));
  order.forEach(({slot, i}) => {
    let best = null, bestPts = -1;
    team.players.forEach((pl, j) => {
      if (used.has(j) || !eligible(pl, slot)) return;
      if (NBA && !ptsFn && pts[j] <= 0) return;   // no game that day: leave the slot empty rather than "start" him
      if (pts[j] > bestPts) { best = j; bestPts = pts[j]; }
    });
    if (best !== null) { used.add(best); picks[i] = {pl: team.players[best], pts: bestPts}; }
  });
  const total = picks.reduce((s, p) => s + (p ? p.pts : 0), 0);
  return {picks, total, bench: team.players.filter((_, j) => !used.has(j))};
}

/** Same starters as `picks`, rearranged so anyone already starting keeps their current slot. */
function alignToCurrent(L, picks, current) {
  const key = pl => pl.sid || pl.name;
  const out = new Array(picks.length).fill(null);
  const left = picks.filter(Boolean);
  L.slots.forEach((slot, i) => {
    const cur = (current[i] || {}).pl;
    const j = cur ? left.findIndex(p => key(p.pl) === key(cur)) : -1;
    if (j >= 0 && eligible(cur, slot)) out[i] = left.splice(j, 1)[0];
  });
  // Place the newcomers, bumping an in-place starter to another slot only when a newcomer can't fit otherwise.
  const place = (p, seen) => {
    const mine = [];
    for (let i = 0; i < L.slots.length; i++) {
      const elig = SLOT_ELIG[L.slots[i]];
      if (!elig || seen.has(i) || !eligible(p.pl, L.slots[i])) continue;
      seen.add(i); mine.push(i);
      if (!out[i]) { out[i] = p; return true; }
    }
    for (const i of mine) {
      const bumped = out[i];
      out[i] = p;
      if (place(bumped, new Set(seen))) return true;
      out[i] = bumped;
    }
    return false;
  };
  for (const p of left) if (!place(p, new Set())) return picks;   // shouldn't happen; show the plain assignment
  return out;
}

function teamStats(L) {
  const done = L.schedule.filter(m => m.week <= lastDone(L) && (m.ap > 0 || m.bp > 0));
  const S = Object.fromEntries(L.teams.map(t => [t.id, {w: 0, l: 0, t: 0, pf: 0, pa: 0, apw: 0, apg: 0, scores: []}]));
  const byWeek = {};
  done.forEach(m => {
    const A = S[m.a], B = S[m.b];
    if (!A || !B) return;
    A.pf += m.ap; A.pa += m.bp; B.pf += m.bp; B.pa += m.ap;
    A.scores.push(m.ap); B.scores.push(m.bp);
    if (m.ap > m.bp) { A.w++; B.l++; } else if (m.bp > m.ap) { B.w++; A.l++; } else { A.t++; B.t++; }
    (byWeek[m.week] = byWeek[m.week] || []).push([m.a, m.ap], [m.b, m.bp]);
  });
  // All-play: your record if you had played every team every week.
  Object.values(byWeek).forEach(list => list.forEach(([id, pts]) => {
    list.forEach(([o, op]) => { if (o !== id) { S[id].apg++; if (pts > op) S[id].apw++; else if (pts === op) S[id].apw += 0.5; } });
  }));
  return {S, done};
}

// Seeded normal draws, so "before" and "after" simulations in the trade analyzer share the same luck.
function makeGauss(seed) {
  let a = seed >>> 0;
  const rand = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  return () => { let u = 0; while (!u) u = rand(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rand()); };
}

function analyse(L, seed = 1) {
  const gauss = makeGauss(seed);
  const {S, done} = teamStats(L);
  const cur = curWeek(L);
  const remaining = L.schedule.filter(m => !(m.week <= lastDone(L) && (m.ap > 0 || m.bp > 0)) && m.week >= cur);
  const futureWeeks = [...new Set(remaining.map(m => m.week))];
  const strengthWeeks = futureWeeks.length ? futureWeeks : [cur];

  // Projected optimal-lineup points per team per week (injuries only matter for the upcoming week).
  const projected = {};
  L.teams.forEach(t => {
    projected[t.id] = {};
    new Set([...strengthWeeks, ...futureWeeks]).forEach(w => { projected[t.id][w] = weekTotal(L, t, w); });
  });
  const strength = Object.fromEntries(L.teams.map(t => [t.id, strengthWeeks.reduce((s, w) => s + projected[t.id][w], 0) / strengthWeeks.length]));

  // Projections are full PPR; scale them to this league's scoring using the points actually scored so far.
  const actual = done.flatMap(m => [m.ap, m.bp]);
  const projNext = L.teams.map(t => strength[t.id]);
  const mean = a => a.reduce((s, x) => s + x, 0) / (a.length || 1);
  // (Basketball projections are already scored with the league's settings, so no scaling there.)
  let scale = !NBA && actual.length && mean(projNext) > 0 ? mean(actual) / mean(projNext) : 1;
  scale = Math.min(1.6, Math.max(0.6, scale));
  const resid = Object.values(S).flatMap(s => { const m = mean(s.scores); return s.scores.map(x => x - m); });
  let sd = resid.length > 8 ? Math.sqrt(mean(resid.map(x => x * x))) : 0;
  if (!sd) sd = 0.2 * mean(projNext) * scale || 20;

  // Power rankings: blend results so far (all-play, record) with rest-of-season roster strength.
  const z = vals => { const m = mean(vals); const s = Math.sqrt(mean(vals.map(v => (v - m) ** 2))) || 1; return vals.map(v => (v - m) / s); };
  const ids = L.teams.map(t => t.id);
  const games = Math.max(0, ...ids.map(id => S[id].w + S[id].l + S[id].t));
  const perfWeight = Math.min(1, games / 6) * 0.6;
  const zAll = z(ids.map(id => S[id].apg ? S[id].apw / S[id].apg : 0.5));
  const zWin = z(ids.map(id => { const g = S[id].w + S[id].l + S[id].t; return g ? (S[id].w + S[id].t / 2) / g : 0.5; }));
  const zStr = z(ids.map(id => strength[id]));
  const raw = ids.map((id, i) => perfWeight * (2 / 3 * zAll[i] + 1 / 3 * zWin[i]) + (1 - perfWeight) * zStr[i]);
  const lo = Math.min(...raw), hi = Math.max(...raw);
  const power = Object.fromEntries(ids.map((id, i) => [id, hi > lo ? 100 * (raw[i] - lo) / (hi - lo) : 50]));
  const powerRank = Object.fromEntries(ids.slice().sort((x, y) => power[y] - power[x]).map((id, i) => [id, i + 1]));

  // Monte Carlo over the remaining regular-season schedule.
  const N = 5000;
  const wins = Object.fromEntries(ids.map(id => [id, 0]));
  const playoffs = Object.fromEntries(ids.map(id => [id, 0]));
  const seed1 = Object.fromEntries(ids.map(id => [id, 0]));
  const nPlayoff = Math.min(L.playoffTeams, ids.length);
  for (let n = 0; n < N; n++) {
    const W = {}, PF = {};
    ids.forEach(id => { W[id] = S[id].w + S[id].t / 2; PF[id] = S[id].pf; });
    remaining.forEach(m => {
      if (!(m.a in W) || !(m.b in W)) return;
      // A week in progress keeps the points already scored and simulates the rest.
      const live = m.week === cur;
      const a = (live ? m.ap : 0) + projected[m.a][m.week] * scale + sd * gauss();
      const b = (live ? m.bp : 0) + projected[m.b][m.week] * scale + sd * gauss();
      PF[m.a] += a; PF[m.b] += b;
      if (a > b) W[m.a]++; else W[m.b]++;
    });
    const order = ids.slice().sort((x, y) => W[y] - W[x] || PF[y] - PF[x]);
    order.slice(0, nPlayoff).forEach(id => playoffs[id]++);
    seed1[order[0]]++;
    ids.forEach(id => { wins[id] += W[id]; });
  }
  const totalGames = Object.fromEntries(ids.map(id => [id, S[id].w + S[id].l + S[id].t + remaining.filter(m => m.a === id || m.b === id).length]));
  return {S, strength, power, powerRank, scale, sd, remaining, wins: Object.fromEntries(ids.map(id => [id, wins[id] / N])),
          playoffs: Object.fromEntries(ids.map(id => [id, playoffs[id] / N])), seed1: Object.fromEntries(ids.map(id => [id, seed1[id] / N])),
          totalGames, nPlayoff, games};
}

// ---------------------------------------------------------------- leagues: roster value (trades, waivers, position strength)
//
// A roster is worth its average weekly best-lineup points from the upcoming week through Week 17,
// so fantasy playoffs count. Trades and pickups are judged by how much they change that number,
// which is what makes position need matter: a third good RB adds little if only two can start.

const HORIZON = NBA ? 'over the next four weeks of games' : 'through Week 17';
const SCORING_NOTE = NBA ? "this league's scoring" : 'full PPR';
const ROS_WEEKS = []; for (let w = D.week; w <= Math.max(D.week, 17); w++) ROS_WEEKS.push(w);
const ALL_POS = NBA ? ['PG', 'SG', 'SF', 'PF', 'C'] : ['QB', 'RB', 'WR', 'TE', 'K', 'DEF'];
const POS_LABEL = NBA ? {ALL: 'Overall', FLEX: 'G/F/UTIL'} : {DEF: 'D/ST'};
const posLabel = p => POS_LABEL[p] || p;

/** A player's projected points per week over the valuation sample (bye or off days count as zero). */
function rosValue(pl) {
  const S = sampleOf(LG);
  const cache = LG._rv || (LG._rv = new Map());
  const k = plKey(pl) + '|' + (pl.inj || '');
  if (!cache.has(k)) cache.set(k, S.periods.reduce((s, p) => s + proj(pl, p, S.now(p)), 0) / S.weeks);
  return cache.get(k);
}

function profile(L, players) {
  const byPos = {};
  let total = 0;
  const S = sampleOf(L);
  S.periods.forEach(w => {
    const b = bestLineup(L, {players}, w, S.now(w));
    total += b.total;
    // Credit points to the slot type, not the player's position: dedicated slots are filled first,
    // so a position's number only changes when its own players do. Flex-type slots get their own bucket,
    // otherwise an RB taking the FLEX from a WR would show up as the WR group getting worse.
    b.picks.forEach((p, i) => {
      if (!p) return;
      const k = strengthBucket(L.slots[i]);
      byPos[k] = (byPos[k] || 0) + p.pts;
    });
  });
  Object.keys(byPos).forEach(k => { byPos[k] /= S.weeks; });
  return {total: total / S.weeks, byPos};
}

function leaguePositions(L) {
  const used = new Set(L.slots.flatMap(s => SLOT_ELIG[s] || []));
  return ALL_POS.filter(p => used.has(p));
}

// A dedicated slot credits its own position (a PG/SG playing the SG slot counts as SG); multi-position slots are FLEX.
const strengthBucket = slot => ((SLOT_ELIG[slot] || []).length > 1 ? 'FLEX' : SLOT_ELIG[slot][0]);

/** Rows of the position-strength tables: each position with its own slot, plus FLEX if the league has any. */
function strengthBuckets(L) {
  const own = new Set(L.slots.filter(s => (SLOT_ELIG[s] || []).length === 1).map(s => SLOT_ELIG[s][0]));
  const out = ALL_POS.filter(p => own.has(p));
  if (L.slots.some(s => (SLOT_ELIG[s] || []).length > 1)) out.push('FLEX');
  return out;
}

/** League rank (1 = best) of every team at every position, from their best-lineup points there. */
function positionRanks(L, profiles) {
  const ranks = {};
  strengthBuckets(L).forEach(pos => {
    const order = L.teams.map(t => t.id).sort((a, b) => (profiles[b].byPos[pos] || 0) - (profiles[a].byPos[pos] || 0));
    order.forEach((id, i) => { (ranks[id] = ranks[id] || {})[pos] = i + 1; });
  });
  return ranks;
}

const plKey = pl => pl.sid || pl.name;

/** Roster after a trade, dropping the lowest-value players if it ends up over the original size. */
function afterTrade(players, give, get) {
  const giveKeys = new Set(give.map(plKey));
  let out = players.filter(p => !giveKeys.has(plKey(p))).concat(get);
  const dropped = [];
  if (out.length > players.length) {
    const keep = new Set(get.map(plKey));
    const droppable = out.filter(p => !keep.has(plKey(p))).sort((a, b) => rosValue(a) - rosValue(b));
    while (out.length > players.length && droppable.length) {
      const d = droppable.shift();
      dropped.push(d);
      out = out.filter(p => p !== d);
    }
  }
  return {players: out, dropped};
}

function withRosters(L, changes) {
  return Object.assign({}, L, {teams: L.teams.map(t => changes[t.id] ? Object.assign({}, t, {players: changes[t.id]}) : t)});
}

function suggestTrades(L, me, profiles) {
  const before = profiles[me.id].total;
  const candidates = players => players.filter(p => rosValue(p) > 0.5).sort((a, b) => rosValue(b) - rosValue(a)).slice(0, 10);
  const mine = candidates(me.players);
  const out = [];
  L.teams.forEach(t => {
    if (t.id === me.id) return;
    const theirs = candidates(t.players);
    const offers = [];
    mine.forEach(a => theirs.forEach(b => offers.push([[a], [b]])));
    const top = mine.slice(0, 8);   // consolidation: two of yours for one of theirs
    for (let i = 0; i < top.length; i++) for (let j = i + 1; j < top.length; j++) theirs.forEach(b => offers.push([[top[i], top[j]], [b]]));
    const found = [];
    offers.forEach(([give, get]) => {
      const mineAfter = afterTrade(me.players, give, get);
      const theirsAfter = afterTrade(t.players, get, give);
      const myGain = profile(L, mineAfter.players).total - before;
      const theirGain = profile(L, theirsAfter.players).total - profiles[t.id].total;
      // Only trades the other side also comes out ahead on: those are the ones they'd accept.
      if (myGain >= 0.5 && theirGain >= 0) found.push({team: t, give, get, myGain, theirGain});
    });
    found.sort((x, y) => (y.myGain + 0.5 * y.theirGain) - (x.myGain + 0.5 * x.theirGain));
    // At most two per partner, and don't repeat the same incoming player.
    const seen = new Set();
    found.filter(f => { const k = f.get.map(plKey).join(); if (seen.has(k)) return false; seen.add(k); return true; })
      .slice(0, 2).forEach(f => out.push(f));
  });
  return out.sort((x, y) => (y.myGain + 0.5 * y.theirGain) - (x.myGain + 0.5 * x.theirGain)).slice(0, 6);
}

function availablePlayers(L) {
  const rostered = new Set(L.teams.flatMap(t => t.players.map(p => p.sid).filter(Boolean)));
  const positions = new Set(leaguePositions(L));
  return Object.entries(P)
    .filter(([sid, p]) => positions.has(p.p) && p.t && !rostered.has(sid))
    .map(([sid, p]) => ({sid, name: p.n, pos: p.p, el: p.el, team: p.t, inj: p.i}));
}

function suggestPickups(L, me, profiles, available) {
  const before = profiles[me.id].total;
  const byPos = {};
  available.forEach(pl => (byPos[pl.pos] = byPos[pl.pos] || []).push(pl));
  // For each promising free agent, every possible drop and what it gains you.
  const options = [];
  Object.values(byPos).forEach(list => {
    list.sort((a, b) => rosValue(b) - rosValue(a)).slice(0, 8).forEach(add => {
      const drops = me.players.map(drop => ({add, drop, gain: profile(L, me.players.filter(p => p !== drop).concat([add])).total - before}))
        .filter(o => o.gain >= 0.2).sort((x, y) => y.gain - x.gain);
      if (drops.length) options.push(drops);
    });
  });
  // You can only drop someone once, so spread the list: each player dropped and each position added at most twice.
  options.sort((x, y) => y[0].gain - x[0].gain);
  const usedDrops = {}, usedPos = {}, out = [];
  options.forEach(drops => {
    if (out.length >= 8 || (usedPos[drops[0].add.pos] || 0) >= 2) return;
    const pick = drops.find(o => (usedDrops[plKey(o.drop)] || 0) < 2);
    if (!pick) return;
    usedDrops[plKey(pick.drop)] = (usedDrops[plKey(pick.drop)] || 0) + 1;
    usedPos[pick.add.pos] = (usedPos[pick.add.pos] || 0) + 1;
    out.push(pick);
  });
  return out.sort((a, b) => b.gain - a.gain);
}

// ---------------------------------------------------------------- leagues: rendering

let renderToken = 0;
let leagueSub = 'overview';
const SUBS = [['overview', 'Overview'], ['matchup', 'Matchup'], ['lineup', NBA ? 'This week' : 'Lineup'], ['trades', 'Trades'], ['waivers', 'Waivers']];

async function renderLeague() {
  const token = ++renderToken;
  const s = store.get();
  if (sleeperLeagues === null) { await refreshSleeperLeagues(); if (token !== renderToken) return; }
  const list = leagueList();
  const bar = document.getElementById('leaguebar');
  const connect = document.getElementById('connect');
  const body = document.getElementById('leagueBody');
  const sel = document.getElementById('leagueSel');
  body.replaceChildren();

  bar.hidden = !list.length;
  connect.hidden = !(!list.length || showConnect);
  if (!list.length) {
    body.appendChild(el('p', 'desc', 'Connect a Sleeper or ESPN league to see power rankings, projected finishes, lineup suggestions, trade ideas and waiver pickups.'));
    return;
  }
  const active = list.find(l => l.key === s.active) || list[0];
  sel.replaceChildren(...list.map(l => { const o = el('option', '', l.label); o.value = l.key; o.selected = l.key === active.key; return o; }));
  document.getElementById('removeLeague').hidden = !active.removable;

  body.appendChild(el('p', 'empty', 'Loading league…'));
  let L;
  try {
    L = await getLeague(active);
  } catch (e) {
    if (token !== renderToken) return;
    body.replaceChildren(el('p', 'err', e.message || String(e)));
    return;
  }
  if (token !== renderToken) return;
  body.replaceChildren();
  if (!Object.keys(P).length) {
    body.appendChild(el('p', 'banner', 'Player projections are missing from this update, so lineups, trades and projected records can\'t be calculated. Run update.py again.'));
  }
  if (!L.teams.length) { body.appendChild(el('p', 'empty', 'This league has no teams yet.')); return; }

  // Remember a public ESPN league's name for the selector.
  if (active.key.startsWith('espn:')) {
    const st = store.get();
    const e = (st.espn || []).find(x => 'espn:' + x.id === active.key);
    if (e && e.name !== L.name) { e.name = L.name; store.set(st); sel.selectedOptions[0].textContent = `${L.name} (ESPN)`; }
  }

  const saved = (store.get().myTeam || {})[active.key];
  const mineId = [saved, L.myTeam].find(id => id != null && L.teams.some(t => t.id === id));
  const me = L.teams.find(t => t.id === mineId) || L.teams[0];

  // Your team picker applies to every sub-tab.
  const head = el('div', 'tools');
  const subs = el('div', 'tabs');
  subs.setAttribute('role', 'group'); subs.setAttribute('aria-label', 'League view');
  tabs(subs, SUBS, leagueSub, v => { leagueSub = v; setHash({sub: v}); renderLeague(); });
  head.appendChild(subs);
  const label = el('label', 'desc', 'Your team ');
  const pick = el('select');
  L.teams.forEach(t => { const o = el('option', '', t.name); o.value = String(t.id); pick.appendChild(o); });
  pick.value = String(me.id);
  pick.addEventListener('change', () => {
    const st = store.get(); st.myTeam = st.myTeam || {};
    const t = L.teams.find(x => String(x.id) === pick.value);
    st.myTeam[active.key] = t.id; store.set(st);
    tradeState = null;
    renderLeague();
  });
  label.appendChild(pick);
  head.appendChild(label);
  body.appendChild(head);

  LG = L;
  const A = analyse(L);
  const profiles = Object.fromEntries(L.teams.map(t => [t.id, profile(L, t.players)]));
  const ctx = {L, A, active, me, profiles, ranks: positionRanks(L, profiles)};
  leagueCtx = ctx;
  if (weekUnderway() && (!leagueLive.at || Date.now() - leagueLive.at > 55000) && !leagueLive.busy) setTimeout(liveLeagueRefresh, 0);
  const content = el('div');
  body.appendChild(content);
  if (leagueSub === 'matchup') renderMatchupTab(ctx, content);
  else if (leagueSub === 'lineup') renderLineupTab(ctx, content);
  else if (leagueSub === 'trades') renderTradesTab(ctx, content, token);
  else if (leagueSub === 'waivers') renderWaiversTab(ctx, content, token);
  else renderOverview(ctx, content);

  const notes = [NBA
    ? `${L.platform} league. Projections are Sleeper's per-game projections scored with this league's settings; a week's total is each day's best lineup among players with games. Roster values use the next four weeks of games.`
    : `${L.platform} league. Projections are Sleeper full-PPR projections; team records and odds are scaled ×${A.scale.toFixed(2)} to match this league's scoring so far.`];
  if (L.slots.some(s => !SLOT_ELIG[s])) notes.push('IDP and other unsupported slots are left out.');
  notes.push(`Injury statuses are as of ${active.key.startsWith('espn:') ? 'ESPN right now' : 'the last update'}; players listed Out, Doubtful or on IR are never suggested to start.`);
  body.appendChild(el('p', 'foot', notes.join(' ')));
}

function teamNameCell(t, me) {
  const c = td('', 'l');
  c.appendChild(leagueCtx && leagueCtx.L.teams.includes(t) ? teamLink(t) : document.createTextNode(t.name));
  if (me && t.id === me.id) c.appendChild(el('span', 'badge', 'You'));
  if (t.owner && t.owner !== t.name) c.appendChild(el('div', 'desc', t.owner));
  return c;
}

const rec = s => `${s.w}–${s.l}${s.t ? '–' + s.t : ''}`;
const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ({1: 'st', 2: 'nd', 3: 'rd'}[n % 10] || 'th'));
const signed = (n, d = 1) => (n > 0 ? '+' : n < 0 ? '−' : '±') + Math.abs(n).toFixed(d);
function rankClass(rank, n) { return rank <= Math.ceil(n / 3) ? 'good' : rank > n - Math.ceil(n / 3) ? 'bad' : ''; }

function section(title, desc) {
  const s = el('div', 'section');
  s.appendChild(el('h2', '', title));
  if (desc) s.appendChild(el('p', 'desc', desc));
  return s;
}

function renderOverview(ctx, box) {
  const {L, A, me, profiles, ranks} = ctx;

  if (mini) box.appendChild(mini);
  const pr = section('Power rankings', A.games

    tr.appendChild(td(fmt(A.strength[t.id] * A.scale)));
    return tr;
  })));

  const positions = strengthBuckets(L);
  const n = L.teams.length;
  const ps = section('Position strengths', `Each team's league rank at each position, from the projected points per week its best lineup gets from that position's own slots ${HORIZON} (${SCORING_NOTE}). FLEX covers the flex slots, whoever fills them. Green is the top third of the league, red the bottom third.`);
  ps.appendChild(table([['Team', 'l'], ...positions.map(posLabel), 'Total'], byPower.map(t => {
    const tr = el('tr');
    tr.appendChild(teamNameCell(t, me));

      const r = ranks[t.id][pos];

    return tr;
  })));
  box.appendChild(ps);

  const pf = section('Projected finishing records', A.remaining.length
    ? `Simulates the ${A.remaining.length} remaining regular-season matchups 5,000 times from each team's best projected lineup each week${NBA ? ' (each day\'s best lineup among players with games)' : ', including bye weeks'}. The top ${A.nPlayoff} make the playoffs (wins, then points for).`
    : 'The regular season is over, so these are the final records.');
  const byWins = L.teams.slice().sort((x, y) => A.wins[y.id] - A.wins[x.id] || A.playoffs[y.id] - A.playoffs[x.id]);

    tr.appendChild(teamNameCell(t, me));
    tr.appendChild(td(rec(A.S[t.id]), 'muted'));
    tr.appendChild(td(`${fmt(w)}–${fmt(l)}`, 'avg'));
    tr.appendChild(td(Math.round(100 * A.playoffs[t.id]) + '%'));
    tr.appendChild(td(Math.round(100 * A.seed1[t.id]) + '%', 'muted'));
    return tr;
  })));
  box.appendChild(pf);
}

/** Basketball: lineups are set daily, so show the rest of this week day by day. */
function renderWeekGrid(L, team) {
  const w = curWeek(L);
  const days = periodsOf(L, w);
  const box = el('div');
  if (!days.length) { box.appendChild(el('p', 'empty', 'No games left this week.')); return box; }
  const lineups = days.map(d => bestLineup(L, team, d, true));
  const startKeys = lineups.map(b => new Set(b.picks.filter(Boolean).map(p => plKey(p.pl))));
  const weekPts = pl => days.reduce((s, d) => s + proj(pl, d, true), 0);
  const players = team.players.slice().sort((a, b) => weekPts(b) - weekPts(a));
  const total = lineups.reduce((s, b) => s + b.total, 0);
  const starts = lineups.reduce((s, b) => s + b.picks.filter(Boolean).length, 0);
  const capacity = L.slots.filter(s => SLOT_ELIG[s]).length;

  // Days with more players playing than starting spots are where the decisions are.
  const crunch = [];
  days.forEach((d, i) => {
    const playing = team.players.filter(pl => proj(pl, d, true) > 0);
    const sit = playing.filter(pl => !startKeys[i].has(plKey(pl)));
    if (sit.length) crunch.push(`${dayLabel(d)}: sit ${sit.map(pl => pl.name).join(', ')}`);
  });
  const summary = el('p', 'desc', `Projected ${fmt(total)} more points this week from ${starts} starts (${capacity} lineup spots a day). ` +
    (crunch.length ? `Bench decisions — ${crunch.join('; ')}.` : 'Every player with a game fits in the lineup each day.'));
  box.appendChild(summary);

  const head = [['Player', 'l'], ...days.map(d => dayLabel(d)), 'Week'];
  const rows = players.map(pl => {
    const tr = el('tr');
    tr.appendChild(playerCell(pl));
    days.forEach((d, i) => {
      const pts = proj(pl, d, true);
      const g = (GAMEDAY[(P[pl.sid] || {}).t] || {})[d];
      if (!g) { tr.appendChild(td('', 'muted')); return; }
      const start = startKeys[i].has(plKey(pl));
      const c = td('', start ? 'cell-start' : 'cell-sit');
      c.appendChild(el('div', '', fmt(pts)));
      c.appendChild(el('div', 'desc', `${g[1] ? 'vs' : '@'} ${g[0]}${start ? '' : ' · sit'}`));
      tr.appendChild(c);
    });
    tr.appendChild(td(fmt(weekPts(pl)), 'avg'));
    return tr;
  });
  const foot = el('tr');
  foot.appendChild(td('Started', 'l'));
  lineups.forEach(b => foot.appendChild(td(fmt(b.total))));
  foot.appendChild(td(fmt(total)));
  box.appendChild(table(head, rows, foot));
  box.appendChild(el('p', 'note', 'Highlighted cells are suggested starts. Points use this league\'s scoring; questionable players are discounted by their estimated chance to play.'));
  return box;
}

function dayLabel(d) {
  const x = new Date(d + 'T12:00:00');
  return x.toLocaleDateString([], {weekday: 'short', month: 'numeric', day: 'numeric'});
}

function renderLineupTab({L, me}, box) {
  if (NBA) {
    const s = section(`This week's lineups · Week ${curWeek(L)}`, 'The best lineup for each remaining day this week, among players whose team plays that day.');
    s.appendChild(renderWeekGrid(L, me));
    box.appendChild(s);
    return;
  }
  const s = section(`Suggested lineup · Week ${D.week}`);
  s.appendChild(renderLineup(L, me));
  box.appendChild(s);
}

function playerLine(pl) { return nameTag(pl); }

function joinPlayers(list) {
  const span = el('span');
  list.forEach((pl, i) => { if (i) span.appendChild(document.createTextNode(' + ')); span.appendChild(playerLine(pl)); });
  return span;
}

/** Biggest position rank change for one team after a roster change, as a phrase. */
function biggestShift(L, profiles, teamId, newPlayers) {
  const after = withProfile(profiles, teamId, profile(L, newPlayers));
  const r0 = positionRanks(L, profiles)[teamId], r1 = positionRanks(L, after)[teamId];
  let best = null;
  strengthBuckets(L).forEach(pos => { const d = r0[pos] - r1[pos]; if (d > 0 && (!best || d > best.d)) best = {pos, d, from: r0[pos], to: r1[pos]}; });
  return best ? `${posLabel(best.pos)} goes from ${ordinal(best.from)} to ${ordinal(best.to)} in the league` : '';
}

function withProfile(profiles, id, p) { return Object.assign({}, profiles, {[id]: p}); }

let tradeState = null;   // {league, partner, give: Set(keys), get: Set(keys)}

function renderTradesTab(ctx, box, token) {
  const {L, me, profiles, ranks, active} = ctx;
  const n = L.teams.length;
  const positions = strengthBuckets(L);

  // Your position strengths and needs
  const mine = section('Your position strengths', `Projected points per week your best lineup gets from each position's own slots ${HORIZON}, against the league average. FLEX covers the flex slots, whoever fills them. Needs are positions where you rank in the bottom half.`);
  const benchBest = {};
  // Basketball changes daily, so "starters" there are who would start on a typical day.
  const starters = new Set((NBA ? bestLineup(L, me, null, false, rosValue) : bestLineup(L, me, D.week, true)).picks.filter(Boolean).map(p => plKey(p.pl)));
  const flexPos = new Set(L.slots.filter(s => (SLOT_ELIG[s] || []).length > 1).flatMap(s => SLOT_ELIG[s]));
  me.players.filter(p => !starters.has(plKey(p))).forEach(p => {
    const own = NBA ? (p.el || [p.pos]) : [p.pos];
    [...own, own.some(x => flexPos.has(x)) ? 'FLEX' : null].filter(Boolean).forEach(k => {
      if (!benchBest[k] || rosValue(p) > rosValue(benchBest[k])) benchBest[k] = p;
    });
  });
  const needs = [];
  mine.appendChild(table([['Position', 'l'], 'Your pts/wk', 'League avg', 'Rank', ['Best bench player', 'l']], positions.map(pos => {
    const v = profiles[me.id].byPos[pos] || 0;
    const avg = L.teams.reduce((s, t) => s + (profiles[t.id].byPos[pos] || 0), 0) / n;
    const r = ranks[me.id][pos];
    if (r > n / 2) needs.push(pos);
    const tr = el('tr');
    tr.appendChild(td(posLabel(pos), 'l'));
    tr.appendChild(td(fmt(v), 'avg'));
    tr.appendChild(td(`${fmt(avg)} (${signed(v - avg)})`, 'muted'));
    tr.appendChild(td(ordinal(r) + ' of ' + n, rankClass(r, n)));
    const b = td('', 'l');
    if (benchBest[pos]) { b.appendChild(playerLine(benchBest[pos])); b.appendChild(el('span', 'muted', ` ${fmt(rosValue(benchBest[pos]))}/wk`)); }
    else b.appendChild(el('span', 'muted', 'None'));
    tr.appendChild(b);
    return tr;
  })));
  mine.appendChild(el('p', 'desc', needs.length ? `Needs: ${needs.map(posLabel).join(', ')}.` : 'No position ranks in the bottom half of your league.'));
  box.appendChild(mine);

  // Suggested trades (computed after first paint: it evaluates a few thousand rosters)
  const sug = section('Suggested trades', `One-for-one and two-for-one trades that raise your projected points per week ${HORIZON} and also leave the other team better off, so they have a reason to accept. "Pts/wk" is best-lineup points, ${SCORING_NOTE}.`);
  const sugBody = el('p', 'empty', 'Looking for trades…');
  sug.appendChild(sugBody);
  box.appendChild(sug);

  const an = section('Trade analyzer', 'Pick a team, then tick the players each side sends. Results update as you go.');
  const anBody = el('div');
  an.appendChild(anBody);
  box.appendChild(an);

  if (!tradeState || tradeState.league !== active.key || !L.teams.some(t => t.id === tradeState.partner && t.id !== me.id)) {
    tradeState = {league: active.key, partner: (L.teams.find(t => t.id !== me.id) || {}).id, give: new Set(), get: new Set()};
  }
  const drawAnalyzer = () => renderAnalyzer(ctx, anBody);
  drawAnalyzer();

  setTimeout(() => {
    if (token !== renderToken) return;
    const trades = suggestTrades(L, me, profiles);
    if (!trades.length) { sugBody.textContent = 'No trades found that improve both teams. Try the analyzer with your own ideas.'; return; }
    const rows = trades.map(tr => {
      const row = el('tr');
      row.appendChild(teamNameCell(tr.team));
      const give = td('', 'l wrap'); give.appendChild(joinPlayers(tr.give)); row.appendChild(give);
      const get = td('', 'l wrap'); get.appendChild(joinPlayers(tr.get));
      const why = biggestShift(L, profiles, me.id, afterTrade(me.players, tr.give, tr.get).players);
      if (why) get.appendChild(el('div', 'desc', `Your ${why}`));
      row.appendChild(get);
      row.appendChild(td(signed(tr.myGain), 'avg good'));
      row.appendChild(td(signed(tr.theirGain), 'muted'));
      const c = td(''); const b = el('button', 'btn ghost', 'Analyze'); b.type = 'button';
      b.addEventListener('click', () => {
        tradeState = {league: active.key, partner: tr.team.id, give: new Set(tr.give.map(plKey)), get: new Set(tr.get.map(plKey))};
        drawAnalyzer();
        an.scrollIntoView({behavior: 'smooth', block: 'start'});
      });
      c.appendChild(b); row.appendChild(c);
      return row;
    });
    sugBody.replaceWith(table([['With', 'l'], ['You give', 'l'], ['You get', 'l'], 'You pts/wk', 'They pts/wk', ''], rows));
  }, 30);
}

function renderAnalyzer(ctx, box) {
  const {L, A, me, profiles} = ctx;
  const st = tradeState;
  const them = L.teams.find(t => t.id === st.partner);
  box.replaceChildren();

  const top = el('div', 'tools');
  const label = el('label', 'desc', 'Trade with ');
  const sel = el('select');
  L.teams.filter(t => t.id !== me.id).forEach(t => { const o = el('option', '', t.name); o.value = String(t.id); sel.appendChild(o); });
  sel.value = String(them.id);
  sel.addEventListener('change', () => {
    tradeState = {league: st.league, partner: L.teams.find(t => String(t.id) === sel.value).id, give: new Set(), get: new Set()};
    renderAnalyzer(ctx, box);
  });
  label.appendChild(sel);
  top.appendChild(label);
  const clear = el('button', 'btn ghost', 'Clear selections');
  clear.type = 'button';
  clear.addEventListener('click', () => { st.give.clear(); st.get.clear(); renderAnalyzer(ctx, box); });
  top.appendChild(clear);
  box.appendChild(top);

  const grid = el('div', 'trade-grid');
  const side = (title, team, picked) => {
    const col = el('fieldset', 'checklist');
    col.appendChild(el('legend', '', title));
    team.players.slice().sort((a, b) => ALL_POS.indexOf(a.pos) - ALL_POS.indexOf(b.pos) || rosValue(b) - rosValue(a)).forEach(pl => {
      const row = el('label', 'check');
      const cb = el('input'); cb.type = 'checkbox'; cb.checked = picked.has(plKey(pl));
      cb.addEventListener('change', () => { if (cb.checked) picked.add(plKey(pl)); else picked.delete(plKey(pl)); drawResult(); });
      row.appendChild(cb);
      row.appendChild(nameTag(pl, {link: false}));   // a link inside the label would fight the checkbox
      row.appendChild(el('span', 'val', fmt(rosValue(pl))));
      col.appendChild(row);
    });
    return col;
  };
  grid.appendChild(side(`You give (${me.name})`, me, st.give));
  grid.appendChild(side(`You get (${them.name})`, them, st.get));
  box.appendChild(grid);
  box.appendChild(el('p', 'note', `Numbers next to players are projected points per week ${HORIZON}${NBA ? ', so players with more games are worth more' : ', counting bye weeks as zero'}.`));

  const result = el('div');
  box.appendChild(result);

  function drawResult() {
    result.replaceChildren();
    clear.disabled = !st.give.size && !st.get.size;
    const give = me.players.filter(p => st.give.has(plKey(p)));
    const get = them.players.filter(p => st.get.has(plKey(p)));
    if (!give.length && !get.length) { result.appendChild(el('p', 'empty', 'Tick players on either side to see how the trade changes both teams.')); return; }
    const mineAfter = afterTrade(me.players, give, get);
    const theirsAfter = afterTrade(them.players, get, give);
    const after = withProfile(withProfile(profiles, me.id, profile(L, mineAfter.players)), them.id, profile(L, theirsAfter.players));
    const myGain = after[me.id].total - profiles[me.id].total;
    const theirGain = after[them.id].total - profiles[them.id].total;

    const verdict = el('p', 'verdict');
    const msg = myGain > 0.3 && theirGain >= 0 ? 'Good for both teams: worth offering.'
      : myGain > 0.3 ? `Good for you, but ${them.name} gets worse, so they may say no.`
      : myGain < -0.3 && theirGain > 0 ? `This helps ${them.name} more than you.`
      : myGain < -0.3 ? 'This makes both teams worse.' : 'Roughly even for you.';
    verdict.appendChild(el('b', '', msg));
    verdict.appendChild(el('span', 'muted', ` You ${signed(myGain)} pts/wk (${fmt(profiles[me.id].total)} → ${fmt(after[me.id].total)}), ${them.name} ${signed(theirGain)} pts/wk.`));
    result.appendChild(verdict);
    const drops = [];
    if (mineAfter.dropped.length) drops.push(`You'd need to drop ${mineAfter.dropped.map(p => p.name).join(', ')} to make room.`);
    if (theirsAfter.dropped.length) drops.push(`${them.name} would need to drop ${theirsAfter.dropped.map(p => p.name).join(', ')}.`);
    if (mineAfter.players.length < me.players.length) drops.push(`You'd have ${me.players.length - mineAfter.players.length} open roster spot(s) for a waiver pickup.`);
    if (drops.length) result.appendChild(el('p', 'note', drops.join(' ')));

    // Position strengths before/after for both teams
    const r0 = positionRanks(L, profiles), r1 = positionRanks(L, after);
    const n = L.teams.length;
    const posTable = team => table([['Position', 'l'], 'Before', 'After', 'Change', 'League rank'], strengthBuckets(L).map(pos => {
      const b = profiles[team.id].byPos[pos] || 0, a = after[team.id].byPos[pos] || 0;
      const tr = el('tr', Math.abs(a - b) > 0.05 ? 'chg' : '');
      tr.appendChild(td(posLabel(pos), 'l'));
      tr.appendChild(td(fmt(b), 'muted'));
      tr.appendChild(td(fmt(a), 'avg'));
      tr.appendChild(td(signed(a - b), a - b > 0.05 ? 'good' : a - b < -0.05 ? 'bad' : 'muted'));
      tr.appendChild(td(r0[team.id][pos] === r1[team.id][pos] ? ordinal(r1[team.id][pos]) : `${ordinal(r0[team.id][pos])} → ${ordinal(r1[team.id][pos])}`, rankClass(r1[team.id][pos], n)));
      return tr;
    }), (() => {
      const f = el('tr');
      f.appendChild(td('Total', 'l')); f.appendChild(td(fmt(profiles[team.id].total))); f.appendChild(td(fmt(after[team.id].total)));
      f.appendChild(td(signed(after[team.id].total - profiles[team.id].total))); f.appendChild(td(''));
      return f;
    })());
    const two = el('div', 'trade-grid');
    [me, them].forEach(team => { const c = el('div'); c.appendChild(el('h3', '', team.id === me.id ? 'Your position strengths' : `${team.name} position strengths`)); c.appendChild(posTable(team)); two.appendChild(c); });
    result.appendChild(two);

    // Power rankings before/after (same simulation seed, so differences come from the trade, not luck)
    const L2 = withRosters(L, {[me.id]: mineAfter.players, [them.id]: theirsAfter.players});
    const A2 = analyse(L2);
    const h = el('h3', '', 'Power rankings after the trade');
    result.appendChild(h);
    const order = L.teams.slice().sort((x, y) => A2.power[y.id] - A2.power[x.id]);
    result.appendChild(table([['#', 'rank'], ['Team', 'l'], 'Power', 'Rank change', 'Playoff odds'], order.map(t => {
      const tr = el('tr', t.id === me.id || t.id === them.id ? 'chg' : '');
      tr.appendChild(td(A2.powerRank[t.id], 'rank'));
      tr.appendChild(teamNameCell(t, me));
      tr.appendChild(td(`${Math.round(A.power[t.id])} → ${Math.round(A2.power[t.id])}`, 'avg'));
      const d = A.powerRank[t.id] - A2.powerRank[t.id];
      tr.appendChild(td(d ? (d > 0 ? `▲ ${d}` : `▼ ${-d}`) : '–', d > 0 ? 'good' : d < 0 ? 'bad' : 'muted'));
      tr.appendChild(td(`${Math.round(100 * A.playoffs[t.id])}% → ${Math.round(100 * A2.playoffs[t.id])}%`));
      return tr;
    })));
  }
  drawResult();
}

let waiverPos = 'RB';

function renderWaiversTab(ctx, box, token) {
  const {L, me, profiles} = ctx;
  const available = availablePlayers(L);
  const rosRank = {};
  Object.entries((D.types.ros || {}).rankings || {}).forEach(([pos, rows]) => {
    if (NBA && pos !== 'ALL') return;
    rows.forEach(r => { if (r.sid) rosRank[r.sid] = NBA ? `#${r.rank}` : `${posLabel(pos)}${r.rank}`; });
  });

  const sug = section('Suggested pickups', `Free agents who would raise your projected points per week ${HORIZON} the most, with the player on your roster it makes the most sense to drop for each.`);
  const sugBody = el('p', 'empty', 'Checking the waiver wire…');
  sug.appendChild(sugBody);
  box.appendChild(sug);

  const best = section('Best available', `Players not on any roster in this league, by projected points per week ${HORIZON} (${SCORING_NOTE}).`);
  const posTabs = el('div', 'tabs');
  best.appendChild(posTabs);
  const listBox = el('div');
  best.appendChild(listBox);
  box.appendChild(best);

  const positions = leaguePositions(L);
  if (!positions.includes(waiverPos)) waiverPos = positions[0];
  // Basketball: games matter as much as talent, so show this week's games and the next four weeks' value.
  const nbaWaiverTable = rows => {
    const w = curWeek(L);
    const days = periodsOf(L, w);
    return table([['#', 'rank'], ['Player', 'l'], ['Next game', 'l'], 'Games left', `Wk ${w} proj`, 'Pts/wk (4 wks)', 'Fpts/game', 'Min', 'ROS rank'], rows.map((pl, i) => {
      const p = P[pl.sid];
      const tr = el('tr');
      tr.appendChild(td(i + 1, 'rank'));
      tr.appendChild(playerCell(pl));
      tr.appendChild(td(gameLabel(nextGame(pl.team)), 'l muted'));
      tr.appendChild(td(days.filter(d => (GAMEDAY[p.t] || {})[d]).length));

let leagueCtx = null;   // the league being shown, for team links in any table

/** A win chance as text: long shots read "<1%" rather than 0% until the result is settled. */
const winPct = p => (p > 0 && p < 0.005 ? '<1%' : p < 1 && p > 0.995 ? '>99%' : Math.round(100 * p) + '%');

/** Standard normal CDF (Abramowitz–Stegun), for win chances. */
function normCdf(x) {
  const t = 1 / (1 + 0.2316419 * Math.abs(x));
  const d = 0.3989423 * Math.exp(-x * x / 2);
  const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
  return x > 0 ? 1 - p : p;
}

const weekMatchup = (L, teamId, w) => L.schedule.find(m => m.week === w && (m.a === teamId || m.b === teamId)) || null;

/** One team's projected lineup for a week: football slot by slot; basketball each player's starts over the remaining days. */
function lineupBreakdown(L, team, w) {
  if (!NBA) {
    const b = bestLineup(L, team, w, true);
    const rows = L.slots.map((slot, i) => ({slot, pl: b.picks[i] && b.picks[i].pl, pts: b.picks[i] ? b.picks[i].pts : 0}))
      .filter(r => SLOT_ELIG[r.slot]);
    return {rows, bench: b.bench.map(pl => ({pl, pts: proj(pl, w, true)})), total: b.total};
  }
  const days = periodsOf(L, w);
  const by = new Map(team.players.map(pl => [plKey(pl), {pl, pts: 0, starts: 0, games: 0}]));
  let total = 0;
  days.forEach(d => {
    const b = bestLineup(L, team, d, true);
    total += b.total;
    team.players.forEach(pl => { if ((GAMEDAY[(P[pl.sid] || {}).t] || {})[d]) by.get(plKey(pl)).games++; });
    b.picks.forEach(p => { if (p) { const r = by.get(plKey(p.pl)); r.pts += p.pts; r.starts++; } });
  });
  const all = [...by.values()].sort((a, b) => b.pts - a.pts || b.games - a.games);
  return {rows: all.filter(r => r.starts), bench: all.filter(r => !r.starts), total, days: days.length};
}

/** Projected final scores and win chance for one matchup this week. */
function matchupOdds(L, A, m, w) {
  const teamA = L.teams.find(t => t.id === m.a), teamB = L.teams.find(t => t.id === m.b);
  const live = w === curWeek(L);
  const started = live && !NBA && weekUnderway();
  const la = started ? liveBreakdown(L, teamA, w) : lineupBreakdown(L, teamA, w);
  const lb = started ? liveBreakdown(L, teamB, w) : lineupBreakdown(L, teamB, w);
  const scoreA = live ? m.ap : 0, scoreB = live ? m.bp : 0;
  const pa = scoreA + la.total * A.scale, pb = scoreB + lb.total * A.scale;
  // The less there is left to play, the less the score can swing.
  const rest = (la.total + lb.total) * A.scale, done = scoreA + scoreB;
  const left = rest + done > 0 ? Math.max(0.02, rest / (rest + done)) : 1;
  const sd = A.sd * Math.sqrt(left) * Math.SQRT2;
  const winA = rest < 0.01 ? (pa > pb ? 1 : pa < pb ? 0 : 0.5) : normCdf((pa - pb) / sd);
  return {teamA, teamB, la, lb, scoreA, scoreB, pa, pb, winA, started, inPlay: live && (anyLive() || done > 0)};
}

// ---------------------------------------------------------------- games: Blind Rank
//
// Five players from one position arrive one at a time; place each in a 1-5 ladder without
// seeing who comes next. Scoring compares every pair of players: getting a pair backwards
// costs the gap between their real ranks, so swapping #9 and #10 barely matters while
// putting #20 above #10 costs ten times as much. Score = 100% minus the share of the
// worst possible cost you paid.

const GAME_POS = NBA ? ['ALL', 'PG', 'SG', 'SF', 'PF', 'C'] : ['QB', 'RB', 'WR', 'TE', 'K', 'DEF'];
// How deep into each board the five players are drawn from (top N at that position).
const GAME_POOL = NBA ? {ALL: 150, PG: 50, SG: 50, SF: 50, PF: 50, C: 40} : {QB: 32, RB: 60, WR: 72, TE: 32, K: 24, DEF: 24};
const GAME_KINDS = () => KINDS.filter(k => GAME_POS.some(p => (((D.types[k] || {}).rankings || {})[p] || []).length >= 5));
const gameStore = {
  key: 'fr-games-v1',
  get() { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },
  set(v) { try { localStorage.setItem(this.key, JSON.stringify(v)); } catch (e) { /* not remembered */ } },
};
let game = {stage: 'setup', pos: GAME_POS[0], kind: 'ros'};
let gameMode = 'blind';

/** Score out of 100 for a ladder (players in the order the user placed them, best first). */
function blindRankScore(placed) {
  let lost = 0, worst = 0;
  for (let i = 0; i < placed.length; i++) {
    for (let j = i + 1; j < placed.length; j++) {
      const gap = Math.abs(placed[i].rank - placed[j].rank);
      worst += gap;
      if (placed[i].rank > placed[j].rank) lost += gap;   // i was placed above j but is really ranked lower
    }
  }
  if (!worst || !lost) return 100;
  if (lost >= worst) return 0;
  return Math.max(1, Math.min(99, Math.round(100 * (1 - lost / worst))));   // 100 is only for a perfect order
}

function gameVerdict(score) {
  if (score === 100) return ['Perfect ranking!', 'You nailed every spot.'];
  if (score >= 90) return ['Expert eye', 'Only the closest calls went the other way.'];
  if (score >= 75) return ['Sharp', 'You know this position.'];
  if (score >= 50) return ['Not bad', 'A couple of big swings cost you.'];
  return ['Back to the film room', 'The board sees it very differently.'];
}

function startGame() {
  const rows = (((D.types[game.kind] || {}).rankings || {})[game.pos] || []).filter(r => r.sid && P[r.sid]);
  const pool = rows.slice(0, Math.min(rows.length, GAME_POOL[game.pos] || 50));
  if (pool.length < 5) return;
  const picks = [];
  const left = pool.slice();
  while (picks.length < 5) picks.push(left.splice(Math.floor(Math.random() * left.length), 1)[0]);
  game = {...game, stage: 'play', deck: picks, turn: 0, slots: [null, null, null, null, null]};
  renderGames();
}

function placeInSlot(i) {
  if (game.stage !== 'play' || game.slots[i]) return;
  game.slots[i] = game.deck[game.turn];
  game.turn++;
  if (game.turn === 5) {
    game.stage = 'done';
    game.score = blindRankScore(game.slots);
    const st = gameStore.get();
    const k = `${D.sport || 'football'}:${game.kind}:${game.pos}`;
    game.prevBest = st[k];
    st[k] = Math.max(st[k] || 0, game.score);
    st.played = (st.played || 0) + 1;
    gameStore.set(st);
  }
  renderGames();
}

document.addEventListener('keydown', e => {
  if (view !== 'games' || game.stage !== 'play' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (document.querySelector('dialog[open]')) return;
  const n = +e.key;
  if (n >= 1 && n <= 5) { e.preventDefault(); placeInSlot(n - 1); }
});

function gameHint(sid) {
  const p = P[sid];
  if (!p) return '';
  const bits = [];
  if (p.b && p.b.bd) { const a = ageFrom(p.b.bd); if (a) bits.push(`Age ${a}`); }
  return bits.join(' · ');
}

function gameCard(r, big) {
  const p = P[r.sid];
  const card = tint(el('div', 'g-card' + (big ? ' big' : '')), p.t);
  card.appendChild(playerPhoto(r.sid, p));

  info.appendChild(meta);
  const hint = gameHint(r.sid);

  card.appendChild(info);
  return card;
}

    const c = gameCard(game.deck[game.turn], true);
    c.classList.add('g-enter');

    left.appendChild(el('p', 'note', 'Click a slot, or press 1–5.'));

    left.appendChild(ring);
    left.appendChild(el('div', 'g-verdict', title));
    left.appendChild(el('p', 'desc', sub + (game.prevBest != null && game.score > game.prevBest ? ` New best for ${posLabel(game.pos)} (was ${game.prevBest}%).` : '')));
    const btns = el('div', 'g-start-row');
    const again = el('button', 'btn g-go', 'Play again'); again.type = 'button'; again.addEventListener('click', startGame);

    const share = el('button', 'btn ghost', 'Copy result'); share.type = 'button';
    share.addEventListener('click', () => {

      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => { share.textContent = 'Copied!'; }, () => { share.textContent = 'Couldn\'t copy'; });

    btns.append(again, change, share);

        slot.appendChild(res);
      }

      slot.appendChild(el('div', 'g-empty', game.stage === 'play' ? 'Place here' : ''));
    }
