  });
  const lw = el('div', 'g-right');
  lw.appendChild(el('div', 'g-ladder-head', game.stage === 'done' ? 'Your ranking vs the board' : 'Your ranking'));
  lw.appendChild(el('div', 'desc g-ends', 'Best'));
  lw.appendChild(ladder);
  lw.appendChild(el('div', 'desc g-ends', 'Worst'));
  stageBox.appendChild(lw);
  box.appendChild(stageBox);
  if (game.stage === 'done') {
    box.appendChild(el('p', 'note', `Ranks are each player's spot on the ${D.types[game.kind].tab.toLowerCase()} ${posLabel(game.pos) === 'Overall' ? 'overall' : posLabel(game.pos)} board. A pair in the wrong order costs the gap between their ranks, so close calls cost little.`));
  }
}

// ---------------------------------------------------------------- games: Draft
//
// Fill a standard starting lineup one pick a round from five players per round. Each round's
// five come from the tier a 12-team snake draft would leave you (players ranked above it are
// treated as taken by other teams), so the options are close in value. Each pick goes into the
// most specific open slot (a RB fills a RB spot before the FLEX), and a position stops appearing
// once no open slot can take it. One respin per draft rerolls the current five. The score
// compares your lineup with the best and worst lineups you could have built from the offers
// you picked from (one player per round).

const DRAFT = NBA
  ? {slots: ['PG', 'SG', 'SF', 'PF', 'C', 'G', 'F', 'UTIL', 'UTIL', 'UTIL']}
  : {slots: ['QB', 'RB', 'RB', 'WR', 'WR', 'TE', 'FLEX', 'K', 'DEF']};
DRAFT.teams = 12;    // the league the tiers come from: round r starts around pick 12(r-1)
DRAFT.width = 30;    // how many ranks deep each round's tier goes
DRAFT.respins = 1;
DRAFT.rounds = DRAFT.slots.length;
// Fill order: dedicated slots before flexible ones.
DRAFT.fill = DRAFT.slots.map((s, i) => i).sort((a, b) => SLOT_ELIG[DRAFT.slots[a]].length - SLOT_ELIG[DRAFT.slots[b]].length || a - b);
// Football has no overall board, so players are compared by points above a typical starter
// at their position (the Nth best in a 12-team league).
const REPLACEMENT = {QB: 12, RB: 30, WR: 30, TE: 12, K: 12, DEF: 12};
let draft = {stage: 'setup'};

/** A player's projected fantasy points per week for the rest of the season. */
function draftValue(sid) {
  const p = P[sid];
  if (!p) return 0;
  if (NBA) {
    const left = gamesOf(p.t).filter(g => g[0] >= TODAY).length;
    const weeks = Math.max(1, Object.values(CAL.weeks).filter(([, end]) => end >= TODAY).length);
    return nbaPoints(p.pg, D.scoring) * left / weeks;
  }
  return ROS_WEEKS.reduce((s, w) => s + (p.proj[String(w)] || 0), 0) / ROS_WEEKS.length;
}

let draftOrderCache = null;
/** Players in overall draft order: basketball's overall board; football by value over replacement. */
function draftOrder() {
  if (draftOrderCache) return draftOrderCache;
  if (NBA) {
    draftOrderCache = (((D.types.ros || {}).rankings || {}).ALL || []).filter(r => r.sid && P[r.sid] && P[r.sid].pg).map(r => r.sid);
  } else {
    const byPos = {};
    Object.entries(P).forEach(([sid, p]) => { if (p.t && REPLACEMENT[p.p]) (byPos[p.p] = byPos[p.p] || []).push([sid, draftValue(sid)]); });
    const vor = [];
    Object.entries(byPos).forEach(([pos, list]) => {
      list.sort((a, b) => b[1] - a[1]);
      const base = (list[Math.min(list.length - 1, REPLACEMENT[pos] - 1)] || [0, 0])[1];
      list.forEach(([sid, v]) => vor.push([sid, v - base]));
    });
    draftOrderCache = vor.sort((a, b) => b[1] - a[1]).map(x => x[0]);
  }
  return draftOrderCache;
}

const draftPl = sid => ({sid, name: P[sid].n, pos: P[sid].p, el: P[sid].el, team: P[sid].t, inj: P[sid].i});
/** The slot a player would fill: the most specific open slot he's eligible for, or -1. */
function draftSpot(sid, filled = draft.filled) {
  const pl = draftPl(sid);
  return DRAFT.fill.find(i => !filled[i] && eligible(pl, DRAFT.slots[i])) ?? -1;
}
const slotName = i => SLOT_LABEL[DRAFT.slots[i]] || DRAFT.slots[i];

function draftOffer(avoid = []) {
  const order = draftOrder();
  const taken = new Set(draft.filled.filter(Boolean));
  const rank = new Map(order.map((sid, i) => [sid, i]));
  const open = order.filter(sid => !taken.has(sid) && draftSpot(sid) >= 0);
  if (!open.length) return [];
  // This round's tier; anyone ranked above it has been taken by the other teams.
  const lo = DRAFT.teams * (draft.round - 1), hi = lo + DRAFT.width;
  let cands = open.filter(sid => rank.get(sid) >= lo && rank.get(sid) < hi);
  if (cands.length < 8) {
    // Few left in the tier who fit an open spot (say, only a K is needed): take the nearest by rank.
    const dist = sid => { const r = rank.get(sid); return r < lo ? lo - r + 1000 : r >= hi ? r - hi + 1 : 0; };
    cands = open.slice().sort((x, y) => dist(x) - dist(y)).slice(0, 12);
  }
  // A respin avoids repeating the five it replaces when it can.
  const fresh = cands.filter(sid => !avoid.includes(sid));
  if (fresh.length >= 5) cands = fresh;
  const offer = [];
  const usedPos = new Set();
  for (let pass = 0; pass < 2 && offer.length < 5; pass++) {
    const pool = cands.filter(sid => !offer.includes(sid));
    while (offer.length < 5 && pool.length) {
      const sid = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
      if (pass || !usedPos.has(P[sid].p)) { offer.push(sid); usedPos.add(P[sid].p); }
    }
  }
  for (const sid of open) { if (offer.length >= 5) break; if (!offer.includes(sid)) offer.push(sid); }
  return offer.sort(() => Math.random() - 0.5);
}

function draftRespin() {
  if (draft.stage !== 'play' || draft.respinsLeft <= 0) return;
  draft.respinsLeft--;
  draft.offer = draftOffer(draft.offer);
  draft.offers[draft.offers.length - 1] = draft.offer;   // graded on the set you picked from
  renderGames();
}

function startDraft() {
  draft = {stage: 'play', round: 1, filled: new Array(DRAFT.rounds).fill(null), pickRound: {}, offers: [], respinsLeft: DRAFT.respins};
  draft.offer = draftOffer();
  draft.offers.push(draft.offer);
  renderGames();
}

function draftPick(sid) {
  if (draft.stage !== 'play' || !draft.offer.includes(sid)) return;
  const i = draftSpot(sid);
  if (i < 0) return;
  draft.filled[i] = sid;
  draft.pickRound[sid] = draft.round;
  if (draft.filled.every(Boolean)) { finishDraft(); return; }
  draft.round++;
  draft.offer = draftOffer();
  if (!draft.offer.length) { finishDraft(); return; }
  draft.offers.push(draft.offer);
  renderGames();
}

/** Best (or worst) full lineup buildable with exactly one player from each round's offer. */
function lineupFromOffers(offers, best) {
  const slots = DRAFT.slots;
  const full = (1 << slots.length) - 1;
  let dp = new Map([[0, 0]]);
  offers.forEach(offer => {
    const next = new Map();
    dp.forEach((v, mask) => offer.forEach(sid => {
      const pl = draftPl(sid), val = draftValue(sid);
      slots.forEach((slot, i) => {
        if (mask & (1 << i) || !eligible(pl, slot)) return;
        const m = mask | (1 << i), nv = v + val;
        if (!next.has(m) || (best ? nv > next.get(m) : nv < next.get(m))) next.set(m, nv);
      });
    }));
    dp = next;
  });
  return dp.has(full) ? dp.get(full) : null;
}

function finishDraft() {
  const mine = draft.filled.reduce((s, sid) => s + (sid ? draftValue(sid) : 0), 0);
  const best = lineupFromOffers(draft.offers, true) ?? mine;
  const worst = lineupFromOffers(draft.offers, false) ?? 0;
  // Share of the way from the worst to the best possible lineup. Only the best possible lineup scores 100.
  const share = best > worst ? Math.max(0, (mine - worst) / (best - worst)) : 1;
  const score = mine >= best - 1e-6 ? 100 : Math.max(0, Math.min(99, Math.round(100 * share)));
  draft = {...draft, stage: 'done', mine, best, worst, score};
  const st = gameStore.get();
  const k = `${D.sport || 'football'}:draft-lineup`;
  draft.prevBest = st[k];
  st[k] = Math.max(st[k] || 0, score);
  gameStore.set(st);
  renderGames();
}

function draftNeeds() {
  const bar = el('div', 'd-needs');
  DRAFT.slots.forEach((slot, i) => {
    const sid = draft.filled[i];
    const chip = el('span', 'd-need' + (sid ? ' full' : ''));
    chip.appendChild(el('b', '', slotName(i)));
    if (sid) chip.appendChild(document.createTextNode(' ' + P[sid].n.split(' ').slice(-1)[0]));
    bar.appendChild(chip);
  });
  return bar;
}

function draftLineupList() {
  const box = el('div', 'd-roster');
  DRAFT.slots.forEach((slot, i) => {
    const sid = draft.filled[i];
    const row = el('div', 'd-roster-row' + (sid ? '' : ' open'));
    row.appendChild(el('span', 'd-roster-pos', slotName(i)));
    if (sid) { row.appendChild(nameTag(draftPl(sid), {pos: false})); row.appendChild(el('span', 'desc', `Rd ${draft.pickRound[sid]}`)); }
    else row.appendChild(el('span', 'muted', 'Open'));
    box.appendChild(row);
  });
  return box;
}

function renderDraft(box) {
  const lineupText = DRAFT.slots.map((s, i) => slotName(i)).join(', ');
  if (draft.stage === 'setup') {
    const card = el('div', 'card g-setup');
    card.appendChild(el('h2', '', `Draft a starting lineup in ${DRAFT.rounds} rounds`));
    card.appendChild(el('p', 'desc', `Fill ${lineupText}. Each round you get five players from the tier you'd be picking from in a ${DRAFT.teams}-team draft, so they're close in value; the stars go early. ` +
      'Your pick goes into the most specific open spot, and once no open spot fits a position, it stops showing up.'));
    card.appendChild(el('p', 'desc', `You get ${DRAFT.respins === 1 ? 'one respin' : DRAFT.respins + ' respins'} per draft to swap a round's five for new ones. Your score compares your lineup with the best and worst you could have built from the sets you picked from. 100 is the best possible team.`));
    const row = el('div', 'g-start-row');
    const go = el('button', 'btn g-go', 'Start draft'); go.type = 'button';
    go.disabled = draftOrder().length < 60;
    go.addEventListener('click', startDraft);
    row.appendChild(go);
    const best = gameStore.get()[`${D.sport || 'football'}:draft-lineup`];
    if (best != null) row.appendChild(el('span', 'desc', `Your best: ${best}`));
    card.appendChild(row);
    box.appendChild(card);
    return;
  }
  if (draft.stage === 'play') {
    const head = el('div', 'd-head');
    const top = el('div', 'd-top');
    top.appendChild(el('div', 'g-verdict', `Round ${draft.round} of ${DRAFT.rounds}`));
    const spin = el('button', 'btn ghost d-respin', draft.respinsLeft > 0 ? `↻ Respin (${draft.respinsLeft} left)` : 'Respin used');
    spin.type = 'button'; spin.disabled = draft.respinsLeft <= 0;
    spin.title = 'Swap these five for a new set from the same tier';
    spin.addEventListener('click', draftRespin);
    top.appendChild(spin);
    head.appendChild(top);
    const prog = el('div', 'd-prog'); const fill = el('span'); fill.style.width = `${100 * (draft.round - 1) / DRAFT.rounds}%`; prog.appendChild(fill);
    head.appendChild(prog);
    head.appendChild(draftNeeds());
    box.appendChild(head);
    const grid = el('div', 'd-offer');
    draft.offer.forEach((sid, i) => {
      const b = el('button', 'd-pick g-enter'); b.type = 'button';
      b.style.animationDelay = `${i * 60}ms`;
      const card = gameCard({sid}, true);
      card.appendChild(el('div', 'd-for', `Fills ${slotName(draftSpot(sid))}`));
      b.appendChild(card);
      b.addEventListener('click', () => draftPick(sid));
      grid.appendChild(b);
    });
    box.appendChild(grid);
    const rw = el('div', 'section');
    rw.appendChild(el('h3', '', 'Your lineup'));
    rw.appendChild(draftLineupList());
    box.appendChild(rw);
    return;
  }
  // Done
  const stage = el('div', 'g-stage');
  const left = el('div', 'g-left');
  const ring = el('div', 'g-ring'); ring.style.setProperty('--pct', String(draft.score));
  ring.appendChild(el('div', 'g-ring-num', String(draft.score)));
  left.appendChild(ring);
  const verdict = draft.score === 100 ? 'Perfect draft!' : draft.score >= 90 ? 'League winner' : draft.score >= 75 ? 'Playoff team' : draft.score >= 50 ? 'Middle of the pack' : 'Rebuilding year';
  left.appendChild(el('div', 'g-verdict', verdict));
  left.appendChild(el('p', 'desc', `Your lineup projects ${fmt(draft.mine)} points a week. The best lineup your offers allowed: ${fmt(draft.best)}; the worst: ${fmt(draft.worst)}.` +
    (draft.prevBest != null && draft.score > draft.prevBest ? ` New best (was ${draft.prevBest}).` : '')));
  const btns = el('div', 'g-start-row');
  const again = el('button', 'btn g-go', 'Draft again'); again.type = 'button'; again.addEventListener('click', startDraft);
  const share = el('button', 'btn ghost', 'Copy result'); share.type = 'button';
  share.addEventListener('click', () => {
    const text = `Draft (${NBA ? 'basketball' : 'football'}): power score ${draft.score}/100\n` +
      DRAFT.slots.map((s, i) => `${slotName(i)}: ${P[draft.filled[i]].n}`).join('\n');
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => { share.textContent = 'Copied!'; }, () => { share.textContent = 'Couldn\'t copy'; });
  });
  btns.append(again, share);
  left.appendChild(btns);
  if (draft.score >= 90 && !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) confetti();
  stage.appendChild(left);

  const right = el('div', 'g-right');
  right.appendChild(el('div', 'g-ladder-head', 'Your lineup'));
  const rows = DRAFT.slots.map((slot, i) => {
    const sid = draft.filled[i];
    const tr = el('tr');
    tr.appendChild(td(slotName(i), 'l muted'));
    const c = td('', 'l'); c.appendChild(nameTag(draftPl(sid))); tr.appendChild(c);
    tr.appendChild(td(`Rd ${draft.pickRound[sid]}`, 'muted'));
    tr.appendChild(td(fmt(draftValue(sid)), 'avg'));
    return tr;
  });
  const foot = el('tr'); foot.appendChild(td('Total', 'l')); foot.appendChild(td('')); foot.appendChild(td('')); foot.appendChild(td(fmt(draft.mine)));
  right.appendChild(table([['Slot', 'l'], ['Player', 'l'], 'Pick', 'Pts/wk'], rows, foot));
  stage.appendChild(right);
  box.appendChild(stage);
  box.appendChild(el('p', 'note', `Points per week are rest-of-season projections (${NBA ? 'ESPN standard points, per-game projection × games left' : 'full PPR'}).`));
}

// ---------------------------------------------------------------- games: Who's That?
//
// Five players, one at a time: face, position and team are shown; name, college and decade
// drafted are the questions. Name and college boxes suggest matches as you type. The decade
// comes from the player's rookie season (Sleeper's years of experience), which is the draft
// year for drafted players and the year an undrafted player entered the league.

const WHO_ROUNDS = 5;
let who = {stage: 'setup'};

const fold = s => String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[.'’`]/g, '').replace(/\s+/g, ' ').trim();
const whoDecade = p => Math.floor((D.season - p.b.exp) / 10) * 10;
const decadeName = d => `${d}s`;

let whoPoolCache = null;
/** Recognizable players with a college and experience on file. */
function whoPool() {
  if (whoPoolCache) return whoPoolCache;
  const order = NBA ? (((D.types.ros || {}).rankings || {}).ALL || []).map(r => r.sid) : draftOrder();
  const ok = sid => { const p = P[sid]; return p && p.t && p.b && p.b.col && typeof p.b.exp === 'number' && (NBA || ['QB', 'RB', 'WR', 'TE'].includes(p.p)); };
  whoPoolCache = [...new Set(order)].filter(ok).slice(0, 150);
  return whoPoolCache;
}

let whoOptionsCache = null;
function whoOptions() {
  if (whoOptionsCache) return whoOptionsCache;
  const names = [...new Set(Object.values(P).filter(p => p.p !== 'DEF').map(p => p.n))].sort();
  const colleges = [...new Set(Object.values(P).map(p => (p.b || {}).col).filter(Boolean))].sort();
  const decades = [...new Set(whoPool().map(sid => whoDecade(P[sid])))].sort();
  for (let d = Math.min(...decades) - 10; d < Math.min(...decades); d += 10) decades.unshift(d);   // one decade earlier as a distractor
  whoOptionsCache = {names, colleges, decades};
  return whoOptionsCache;
}

/** A text box that suggests matching options as you type (arrow keys + Enter, or click). */
function combo(labelText, options, placeholder) {
  const wrap = el('div', 'combo');
  const id = 'c' + Math.random().toString(36).slice(2, 8);
  const label = el('label', 'combo-label', labelText); label.htmlFor = id;
  const input = el('input'); input.type = 'text'; input.id = id; input.placeholder = placeholder;
  input.autocomplete = 'off'; input.spellcheck = false;
  input.setAttribute('role', 'combobox'); input.setAttribute('aria-autocomplete', 'list'); input.setAttribute('aria-expanded', 'false');
  const list = el('ul', 'combo-list'); list.id = id + '-list'; list.setAttribute('role', 'listbox'); list.hidden = true;
  input.setAttribute('aria-controls', list.id);
  const folded = options.map(o => [o, fold(o)]);
  let matches = [], active = -1;
  const close = () => { list.hidden = true; input.setAttribute('aria-expanded', 'false'); active = -1; };
  const choose = o => { input.value = o; close(); input.dispatchEvent(new Event('change')); };
  const paint = () => {
    list.replaceChildren();
    matches.forEach((o, i) => {
      const li = el('li', i === active ? 'on' : ''); li.setAttribute('role', 'option'); li.id = `${id}-o${i}`;
      li.setAttribute('aria-selected', String(i === active));
      const q = fold(input.value), f = fold(o), at = f.indexOf(q);
      // Bold the typed part when the display text lines up with the folded text.
      if (q && at >= 0 && o.length === f.length) {
        li.append(document.createTextNode(o.slice(0, at)), el('b', '', o.slice(at, at + q.length)), document.createTextNode(o.slice(at + q.length)));
      } else li.textContent = o;
      li.addEventListener('mousedown', e => { e.preventDefault(); choose(o); });
      list.appendChild(li);
    });
    if (active >= 0) input.setAttribute('aria-activedescendant', `${id}-o${active}`); else input.removeAttribute('aria-activedescendant');
    list.hidden = !matches.length;
    input.setAttribute('aria-expanded', String(!!matches.length));
  };
  input.addEventListener('input', () => {
    const q = fold(input.value);
    if (!q) { matches = []; close(); return; }
    // Matches at the start of a word first ("cle" → Clemson), then anywhere.
    const starts = [], inside = [];
    folded.forEach(([o, f]) => {
      const at = f.indexOf(q);
      if (at < 0) return;
      (at === 0 || f[at - 1] === ' ' ? starts : inside).push(o);
    });
    matches = starts.concat(inside).slice(0, 8);
    active = matches.length ? 0 : -1;
    paint();
  });
  input.addEventListener('keydown', e => {
    if (list.hidden) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); active = (active + 1) % matches.length; paint(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = (active - 1 + matches.length) % matches.length; paint(); }
    else if (e.key === 'Enter' && active >= 0) { e.preventDefault(); choose(matches[active]); }
    else if (e.key === 'Escape') { close(); }
  });
  input.addEventListener('blur', () => setTimeout(close, 120));
  wrap.append(label, input, list);
  return {root: wrap, input};
}

function startWho() {
  const pool = whoPool().slice();
  const picks = [];
  while (picks.length < WHO_ROUNDS && pool.length) picks.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  who = {stage: 'play', picks, turn: 0, answers: [], revealed: false};
  renderGames();
}

function whoCheck(sid, a) {
  const p = P[sid];
  return {
    name: fold(a.name) === fold(p.n) || normName(a.name || '') === normName(p.n),
    college: fold(a.college) === fold(p.b.col),
    decade: +a.decade === whoDecade(p),
  };
}

function whoScore() {
  const right = who.answers.reduce((s, a, i) => { const c = whoCheck(who.picks[i], a); return s + c.name + c.college + c.decade; }, 0);
  return {right, total: who.answers.length * 3, pct: Math.round(100 * right / (who.answers.length * 3))};
}

function renderWho(box) {
  if (who.stage === 'setup') {
    const card = el('div', 'card g-setup');
    card.appendChild(el('h2', '', `Name ${WHO_ROUNDS} players`));
    card.appendChild(el('p', 'desc', 'You see a face, position and team. Fill in his name, his college and the decade he was drafted. Name and college boxes suggest answers as you type.'));
    card.appendChild(el('p', 'desc', `Players come from the top ${whoPool().length} on the rest-of-season board. Each player is worth 3 points: one per correct answer.`));
    const row = el('div', 'g-start-row');
    const go = el('button', 'btn g-go', 'Start'); go.type = 'button'; go.disabled = whoPool().length < WHO_ROUNDS;
    go.addEventListener('click', startWho);
    row.appendChild(go);
    const best = gameStore.get()[`${D.sport || 'football'}:who`];
    if (best != null) row.appendChild(el('span', 'desc', `Your best: ${best}%`));
    card.appendChild(row);
    box.appendChild(card);
    return;
  }
  if (who.stage === 'done') {
    const s = whoScore();
    const stage = el('div', 'g-stage');
    const left = el('div', 'g-left');
    const ring = el('div', 'g-ring'); ring.style.setProperty('--pct', String(s.pct));
    ring.appendChild(el('div', 'g-ring-num', s.pct + '%'));
    left.appendChild(ring);
    left.appendChild(el('div', 'g-verdict', s.pct === 100 ? 'Encyclopedia!' : s.pct >= 80 ? 'Scout material' : s.pct >= 60 ? 'True fan' : s.pct >= 40 ? 'Getting there' : 'Rookie'));
    left.appendChild(el('p', 'desc', `${s.right} of ${s.total} answers right.` + (who.prevBest != null && s.pct > who.prevBest ? ` New best (was ${who.prevBest}%).` : '')));
    const btns = el('div', 'g-start-row');
    const again = el('button', 'btn g-go', 'Play again'); again.type = 'button'; again.addEventListener('click', startWho);
    btns.appendChild(again);
    left.appendChild(btns);
    if (s.pct >= 90 && !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) confetti();
    stage.appendChild(left);
    const right = el('div', 'g-right');
    right.appendChild(el('div', 'g-ladder-head', 'Answer key'));
    const mark = ok => el('span', ok ? 'good' : 'bad', ok ? '✓' : '✗');
    const rows = who.picks.map((sid, i) => {
      const p = P[sid], a = who.answers[i], c = whoCheck(sid, a);
      const tr = el('tr');
      const n = td('', 'l'); n.appendChild(nameTag({sid, name: p.n, pos: p.p, team: p.t}, {pos: false})); tr.appendChild(n);
      [[c.name, a.name || '—'], [c.college, p.b.col], [c.decade, decadeName(whoDecade(p))]].forEach(([ok, text], j) => {
        const cell = td('', 'l'); cell.appendChild(mark(ok)); cell.appendChild(document.createTextNode(' ' + (j === 0 ? (ok ? 'Got it' : `You: ${text}`) : text)));
        tr.appendChild(cell);
      });
      return tr;
    });
    right.appendChild(table([['Player', 'l'], ['Name', 'l'], ['College', 'l'], ['Drafted', 'l']], rows));
    stage.appendChild(right);
    box.appendChild(stage);
    box.appendChild(el('p', 'note', 'Decade drafted is the decade of the player\'s rookie season, which is his draft year for drafted players.'));
    return;
  }

  // Playing
  const sid = who.picks[who.turn], p = P[sid];
  const stage = el('div', 'g-stage');
  const left = el('div', 'g-left');
  const dots = el('div', 'g-dots');
  for (let i = 0; i < WHO_ROUNDS; i++) dots.appendChild(el('span', i < who.turn ? 'done' : i === who.turn ? 'now' : ''));
  left.appendChild(dots);
  left.appendChild(el('div', 'desc', `Player ${who.turn + 1} of ${WHO_ROUNDS}`));
  const card = tint(el('div', 'g-card big g-enter'), p.t);
  card.appendChild(playerPhoto(sid, p));
  const meta = el('div', 'pl-meta');
  const chip = teamChip(p.t); if (chip) meta.appendChild(chip);
  meta.appendChild(el('span', 'desc', `${NBA ? (p.el || [p.p]).join('/') : posLabel(p.p)} · ${teamFullName(p.t)}`));
  card.appendChild(meta);
  if (who.revealed) card.appendChild(el('div', 'g-card-name', p.n));
  else card.appendChild(el('div', 'g-card-name who-mystery', '?'));
  left.appendChild(card);
  stage.appendChild(left);

  const right = el('div', 'g-right');
  const opts = whoOptions();
  const form = el('form', 'card who-form');
  form.noValidate = true;
  const name = combo('Name', opts.names, 'Start typing a name');
  const college = combo('College', opts.colleges, 'Start typing a college');
  const decWrap = el('div', 'combo');
  const decId = 'dec' + who.turn;
  const decLabel = el('label', 'combo-label', 'Decade drafted'); decLabel.htmlFor = decId;
  const dec = el('select'); dec.id = decId;
  dec.appendChild(Object.assign(el('option', '', 'Pick a decade'), {value: ''}));
  opts.decades.forEach(d => { const o = el('option', '', decadeName(d)); o.value = String(d); dec.appendChild(o); });
  decWrap.append(decLabel, dec);
  form.append(name.root, college.root, decWrap);

  const a = who.answers[who.turn];
  if (who.revealed && a) {
    name.input.value = a.name; college.input.value = a.college; dec.value = a.decade;
    [name.input, college.input, dec].forEach(x => { x.disabled = true; });
    const c = whoCheck(sid, a);
    const fb = el('div', 'who-feedback');
    [['Name', c.name, p.n], ['College', c.college, p.b.col], ['Drafted', c.decade, decadeName(whoDecade(p))]].forEach(([label, ok, truth]) => {
      const row = el('div', 'who-fb ' + (ok ? 'ok' : 'no'));
      row.appendChild(el('b', '', ok ? '✓' : '✗'));
      row.appendChild(document.createTextNode(` ${label}: ${truth}`));
      fb.appendChild(row);
    });
    form.appendChild(fb);
    const next = el('button', 'btn g-go', who.turn + 1 < WHO_ROUNDS ? 'Next player' : 'See results'); next.type = 'submit';
    form.appendChild(next);
    form.addEventListener('submit', e => {
      e.preventDefault();
      if (who.turn + 1 < WHO_ROUNDS) { who.turn++; who.revealed = false; renderGames(); return; }
      const s = whoScore();
      const st = gameStore.get(); const k = `${D.sport || 'football'}:who`;
      who.prevBest = st[k]; st[k] = Math.max(st[k] || 0, s.pct); gameStore.set(st);
      who.stage = 'done'; renderGames();
    });
    setTimeout(() => next.focus(), 0);
  } else {
    const submit = el('button', 'btn g-go', 'Lock in'); submit.type = 'submit';
    form.appendChild(submit);
    form.appendChild(el('p', 'note', 'Not sure? Leave a box blank and lock in anyway.'));
    form.addEventListener('submit', e => {
      e.preventDefault();
      who.answers[who.turn] = {name: name.input.value.trim(), college: college.input.value.trim(), decade: dec.value};
      who.revealed = true;
      renderGames();
    });
    setTimeout(() => name.input.focus(), 0);
  }
  right.appendChild(form);
  stage.appendChild(right);
  box.appendChild(stage);
}

function confetti() {
  const colors = ['#1d63ed', '#0ea5a4', '#f59e0b', '#ef4444', '#22c55e', '#a855f7'];
  const layer = el('div', 'confetti');
  for (let i = 0; i < 70; i++) {
    const c = el('i');
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDelay = Math.random() * 0.4 + 's';
    c.style.animationDuration = 1.6 + Math.random() * 1.2 + 's';
    c.style.transform = `rotate(${Math.random() * 360}deg)`;
    layer.appendChild(c);
  }
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 3200);
}

// ---------------------------------------------------------------- weekly slate: games, lines, live scores, highlights
//
// Scores come live from ESPN's public scoreboard, which a page may read directly. Betting
// lines vanish from it once a game starts, so update.py saves the pre-game lines (D.slate.odds)
// and the page keeps whichever it saw last. While games are live the scoreboard is re-read
// every 20 seconds; football big plays come from each live game's play-by-play.

const SLATE_PATH = NBA ? 'basketball/nba' : 'football/nfl';
const ESPN_TO_SLEEPER = NBA ? {GS: 'GSW', NY: 'NYK', SA: 'SAS', NO: 'NOP', UTAH: 'UTA', WSH: 'WAS'} : {WSH: 'WAS'};
const abbrOf = a => ESPN_TO_SLEEPER[a] || a;
const slate = {events: [], odds: Object.assign({}, (D.slate || {}).odds), plays: {}, fetched: null, error: null, day: null, hi: 0, loading: false, tick: 0};
const TEAM_LIVE = {};   // football: team -> status; basketball: "team|date" -> status. {state, left (share of game left), detail}

const etDate = iso => new Date(iso).toLocaleDateString('en-CA', {timeZone: 'America/New_York'});
const timeLabel = iso => new Date(iso).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});

function slateUrls() {
  const base = `https://site.api.espn.com/apis/site/v2/sports/${SLATE_PATH}/scoreboard`;
  if (!NBA) return [`${base}?seasontype=2&week=${D.week}&dates=${D.season}`];
  const wk = CAL.weeks[String(D.week)] || [TODAY, TODAY];
  return datesBetween(wk[0], wk[1]).map(d => `${base}?dates=${d.replace(/-/g, '')}`);   // one day per request
}

function parseLines(c) {
  const o = (c.odds || [])[0];
  if (!o) return null;
  const ml = o.moneyline || {};
  const price = side => (((ml[side] || {}).close || {}).odds) || (((ml[side] || {}).open || {}).odds) || null;
  return {details: o.details, ou: o.overUnder, mlHome: price('home'), mlAway: price('away'), provider: (o.provider || {}).name};
}

function parseSlateEvent(e) {
  const c = (e.competitions || [])[0] || {};
  const status = e.status || {};
  const st = status.type || {};
  const side = ha => {
    const t = (c.competitors || []).find(x => x.homeAway === ha) || {};
    const tm = t.team || {};
    const rating = (t.leaders || []).find(l => l.name === 'rating');
    const lead = rating && rating.leaders && rating.leaders[0];
    return {id: tm.id, abbr: abbrOf(tm.abbreviation), name: tm.shortDisplayName || tm.displayName || tm.abbreviation,
            logo: tm.logo, record: ((t.records || [])[0] || {}).summary, score: t.score, winner: t.winner,
            leader: lead ? {name: lead.athlete.displayName, id: lead.athlete.id, line: lead.displayValue} : null};
  };
  const lines = parseLines(c);
  if (lines) slate.odds[String(e.id)] = lines;
  const sit = c.situation || {};
  const home = side('home'), away = side('away');
  return {
    id: String(e.id), date: e.date, state: st.state, detail: st.shortDetail, period: status.period || 0,
    clock: status.clock || 0, home, away, tv: (((c.broadcasts || [])[0] || {}).names || []).join(', '),
    situation: st.state === 'in' && sit.downDistanceText ? {
      text: sit.downDistanceText, ball: sit.possession === home.id ? home.abbr : sit.possession === away.id ? away.abbr : null,
      lastPlay: (sit.lastPlay || {}).text, homeWin: ((sit.lastPlay || {}).probability || {}).homeWinPercentage,
    } : null,
  };
}

/** Share of a game still to play: 1 before it starts, 0 once it's over. */
function gameLeft(ev) {
  if (ev.state === 'pre') return 1;
  if (ev.state === 'post') return 0;
  const len = NBA ? 720 : 900, periods = 4;
  if (ev.period > periods) return 0.03;   // overtime
  return Math.max(0, Math.min(1, ((periods - ev.period) * len + ev.clock) / (periods * len)));
}

function updateTeamStatus() {
  Object.keys(TEAM_LIVE).forEach(k => delete TEAM_LIVE[k]);
  slate.events.forEach(ev => {
    const s = {state: ev.state, left: gameLeft(ev), detail: ev.state === 'pre' ? `${new Date(ev.date).toLocaleDateString([], {weekday: 'short'})} ${timeLabel(ev.date)}` : ev.detail};
    [ev.home.abbr, ev.away.abbr].forEach(t => { TEAM_LIVE[NBA ? `${t}|${etDate(ev.date)}` : t] = s; });
  });
}
const teamLive = (team, date) => TEAM_LIVE[NBA ? `${team}|${date}` : team];
/** Share of a player's game left this week (football) or on a date (basketball): scales projections while games are on. */
const liveLeft = (team, date) => { const s = teamLive(team, date); return s ? s.left : 1; };
const weekUnderway = () => slate.events.some(e => e.state !== 'pre');
const anyLive = () => slate.events.some(e => e.state === 'in');

const BIG_TYPES = new Set(['Pass Reception', 'Rush', 'Passing Touchdown', 'Rushing Touchdown', 'Pass Interception Return',
  'Interception Return Touchdown', 'Fumble Return Touchdown', 'Kickoff Return Touchdown', 'Punt Return Touchdown', 'Fumble Recovery (Opponent)']);

async function refreshPlays() {
  const want = slate.events.filter(e => e.state === 'in' || (e.state === 'post' && !(slate.plays[e.id] || {}).final));
  await Promise.all(want.slice(0, 16).map(async ev => {
    try {
      const s = await getJSON(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=${ev.id}`);
      const plays = [];
      ((s.drives || {}).previous || []).concat((s.drives || {}).current ? [s.drives.current] : []).forEach(dr => (dr.plays || []).forEach(p => {
        const type = (p.type || {}).text || '';
        if (!BIG_TYPES.has(type)) return;
        if (!(p.scoringPlay || p.isTurnover || (p.statYardage || 0) >= 20)) return;
        plays.push({id: p.id, gid: ev.id, type, text: p.text, yards: p.statYardage, td: p.scoringPlay, to: p.isTurnover,
                    team: abbrOf(((dr.team || {}).abbreviation) || ''), period: (p.period || {}).number, clock: (p.clock || {}).displayValue,
                    away: p.awayScore, home: p.homeScore, at: p.wallclock || ''});
      }));
      slate.plays[ev.id] = {final: ev.state === 'post', list: plays};
    } catch (e) { /* skip this game this time */ }
  }));
}

async function refreshSlate() {
  if (slate.loading) return;
  slate.loading = true;
  try {
    const lists = await Promise.all(slateUrls().map(u => getJSON(u).then(d => d.events || []).catch(() => null)));
    const events = lists.filter(Boolean).flat().map(parseSlateEvent).sort((a, b) => a.date.localeCompare(b.date));
    if (events.length) { slate.events = events; slate.error = null; }
    else if (lists.every(x => x === null)) slate.error = 'Couldn\'t reach ESPN for live scores. Check your connection.';
    slate.fetched = new Date();
    if (!NBA) await refreshPlays();
    updateTeamStatus();
    if (LG) { LG._fp = new Map(); LG._rv = new Map(); }   // projections depend on how much of each game is left
  } finally { slate.loading = false; }
  if (view === 'slate') renderSlate();
  if (view === 'league') liveLeagueRefresh();
}

// Every 20 seconds while games are live, every 5 minutes otherwise; only while the tab is visible.
setInterval(() => {
  if (document.hidden || !['slate', 'league'].includes(view)) return;
  slate.tick++;
  if (anyLive() || slate.tick % 15 === 0) refreshSlate();
}, 20000);

function highlights() {
  const label = ev => `${ev.away.abbr} ${ev.away.score ?? ''} – ${ev.home.abbr} ${ev.home.score ?? ''} · ${ev.state === 'in' ? ev.detail : 'Final'}`;
  const byId = Object.fromEntries(slate.events.map(e => [e.id, e]));
  if (NBA) {
    const out = [];
    slate.events.filter(e => e.state !== 'pre').forEach(ev => [ev.away, ev.home].forEach(t => {
      if (!t.leader) return;
      const pts = parseInt((t.leader.line.match(/(\d+)\s*PTS/) || [])[1] || '0', 10);
      out.push({gid: ev.id, live: ev.state === 'in', pts, kicker: ev.state === 'in' ? 'Live' : 'Top performer', title: t.leader.name, line: t.leader.line,
                team: t.abbr, game: label(ev), img: `https://a.espncdn.com/i/headshots/nba/players/full/${t.leader.id}.png`});
    }));
    return out.sort((a, b) => (b.live - a.live) || b.pts - a.pts).slice(0, 20);
  }
  return Object.values(slate.plays).flatMap(g => g.list).sort((a, b) => b.at.localeCompare(a.at)).slice(0, 25).map(p => {
    const ev = byId[p.gid];
    const kicker = p.td ? 'Touchdown' : p.to ? 'Turnover' : `${p.yards}-yard ${/Rush/.test(p.type) ? 'run' : 'play'}`;
    return {gid: p.gid, live: ev && ev.state === 'in', kicker, title: p.text.replace(/\s*\(.*?\)\s*/g, ' ').trim(), line: `Q${p.period} ${p.clock || ''}`.trim(),
            team: p.team, game: ev ? label(ev) : '', img: null};
  });
}

function paintTicker(box) {
  const items = highlights();
  box.replaceChildren();
  if (!items.length) {
    const next = slate.events.find(e => e.state === 'pre');
    box.appendChild(el('div', 'sl-tk-empty', NBA ? 'Player highs show up here once games tip off.' : 'Big plays show up here once games kick off.'));
    if (next) box.appendChild(el('div', 'desc', `Next up: ${next.away.abbr} at ${next.home.abbr}, ${new Date(next.date).toLocaleDateString([], {weekday: 'short'})} ${timeLabel(next.date)}`));
    return;
  }
  const it = items[slate.hi % items.length];
  const card = tint(el('div', 'sl-tk-card'), it.team);
  if (it.gid) { card.classList.add('clickable'); card.addEventListener('click', () => openGame(it.gid)); card.title = 'Open this game'; }
  const pic = el('div', 'sl-tk-pic');
  if (it.img) {
    const img = el('img'); img.alt = ''; img.src = it.img;
    img.addEventListener('error', () => { pic.replaceChildren(teamChip(it.team) || el('span', '', it.team)); });
    pic.appendChild(img);
  } else pic.appendChild(teamChip(it.team) || el('span', '', it.team));
  card.appendChild(pic);
  const text = el('div', 'sl-tk-text');
  const k = el('div', 'sl-tk-kicker');
  if (it.live) k.appendChild(el('span', 'sl-live-dot', ''));
  k.appendChild(document.createTextNode(it.kicker));
  text.appendChild(k);
  text.appendChild(el('div', 'sl-tk-title', it.title));
  text.appendChild(el('div', 'desc', [it.line, it.game].filter(Boolean).join(' · ')));
  card.appendChild(text);
  card.appendChild(el('div', 'sl-tk-count', `${(slate.hi % items.length) + 1}/${items.length}`));
  box.appendChild(card);
}

setInterval(() => {
  if (view !== 'slate' || document.hidden) return;
  slate.hi++;
  const t = document.getElementById('sl-ticker');
  if (t) paintTicker(t);
}, 6000);

const fmtLine = v => (v == null ? '–' : String(v));

function slateCard(ev) {
  const card = el('div', 'sl-game ' + ev.state);
  card.tabIndex = 0;
  card.setAttribute('role', 'button');
  card.setAttribute('aria-label', `${ev.away.name} at ${ev.home.name}: open plays and box score`);
  card.addEventListener('click', () => openGame(ev.id));
  card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openGame(ev.id); } });
  const top = el('div', 'sl-status');
  if (ev.state === 'in') { top.appendChild(el('span', 'sl-live-dot', '')); top.appendChild(el('b', '', ev.detail)); }
  else if (ev.state === 'post') top.appendChild(el('b', '', ev.detail || 'Final'));
  else top.appendChild(el('b', '', `${new Date(ev.date).toLocaleDateString([], {weekday: 'short', month: 'short', day: 'numeric'})} · ${timeLabel(ev.date)}`));
  if (ev.tv && ev.state !== 'post') top.appendChild(el('span', 'desc', ev.tv));
  card.appendChild(top);
  [ev.away, ev.home].forEach(t => {
    const row = el('div', 'sl-team' + (ev.state === 'post' && t.winner ? ' won' : ''));
    const logo = el('div', 'sl-logo');
    if (t.logo) { const img = el('img'); img.alt = ''; img.loading = 'lazy'; img.src = t.logo; img.addEventListener('error', () => img.remove()); logo.appendChild(img); }
    row.appendChild(logo);
    const nm = el('div', 'sl-name');
    nm.appendChild(el('b', '', t.name));
    const chip = teamChip(t.abbr); if (chip) nm.appendChild(chip);
    if (t.record) nm.appendChild(el('span', 'desc', t.record));
    if (ev.situation && ev.situation.ball === t.abbr) nm.appendChild(el('span', 'sl-ball', NBA ? '' : '🏈'));
    row.appendChild(nm);
    row.appendChild(el('div', 'sl-score', ev.state === 'pre' ? '' : String(t.score ?? '')));
    card.appendChild(row);
  });
  const odds = slate.odds[ev.id];
  if (odds) {
    const o = el('div', 'sl-odds');
    o.appendChild(el('span', '', `Spread ${fmtLine(odds.details)}`));
    o.appendChild(el('span', '', `O/U ${fmtLine(odds.ou)}`));
    o.appendChild(el('span', '', `ML ${ev.away.abbr} ${fmtLine(odds.mlAway)} · ${ev.home.abbr} ${fmtLine(odds.mlHome)}`));
    if (ev.state !== 'pre') o.appendChild(el('span', 'muted', 'pre-game'));
    card.appendChild(o);
  } else if (ev.state === 'pre') card.appendChild(el('div', 'sl-odds muted', 'Lines not posted yet'));
  if (ev.situation) {
    const s = el('div', 'sl-sit');
    s.appendChild(el('div', '', `${ev.situation.text}${ev.situation.ball ? ` · ${ev.situation.ball} ball` : ''}`));
    if (ev.situation.lastPlay) s.appendChild(el('div', 'desc', ev.situation.lastPlay));
    if (ev.situation.homeWin != null) {
      const bar = el('div', 'sl-wp'); const f = el('span'); f.style.width = `${Math.round(100 * (1 - ev.situation.homeWin))}%`; bar.appendChild(f);
      s.appendChild(bar);
      s.appendChild(el('div', 'desc', `Win chance: ${ev.away.abbr} ${Math.round(100 * (1 - ev.situation.homeWin))}% · ${ev.home.abbr} ${Math.round(100 * ev.situation.homeWin)}%`));
    }
    card.appendChild(s);
  }
  if (NBA && ev.state !== 'pre') {
    const lead = [ev.away, ev.home].filter(t => t.leader).map(t => `${t.abbr}: ${t.leader.name} ${t.leader.line}`);
    if (lead.length) card.appendChild(el('div', 'sl-lead desc', lead.join(' · ')));
  }
  return card;
}

function renderSlate() {
  const box = document.getElementById('slateBody');
  box.replaceChildren();
  const head = el('div', 'tools');
  const titleBox = el('div');
  titleBox.appendChild(el('h2', '', `Week ${D.week} slate`));
  const live = anyLive();
  const status = el('div', 'desc');
  if (live) status.appendChild(el('span', 'sl-live-dot', ''));
  status.appendChild(document.createTextNode(slate.fetched
    ? `${live ? 'Live · ' : ''}Updated ${slate.fetched.toLocaleTimeString([], {hour: 'numeric', minute: '2-digit', second: '2-digit'})}${live ? ' · refreshes every 20 seconds' : ''}`
    : 'Loading scores from ESPN…'));
  titleBox.appendChild(status);
  head.appendChild(titleBox);
  const btn = el('button', 'btn ghost', 'Refresh'); btn.type = 'button'; btn.addEventListener('click', refreshSlate);
  head.appendChild(btn);
  box.appendChild(head);
  if (slate.error) box.appendChild(el('p', 'err', slate.error));

  const ticker = el('div', 'sl-ticker'); ticker.id = 'sl-ticker';
  box.appendChild(ticker);
  paintTicker(ticker);

  if (!slate.events.length) { box.appendChild(el('p', 'empty', slate.fetched ? 'No games found for this week.' : 'Loading games…')); return; }
  // Group by day; basketball gets day tabs since there are ~50 games a week.
  const days = [...new Set(slate.events.map(e => etDate(e.date)))];
  let shown = days;
  if (NBA) {
    if (!days.includes(slate.day)) slate.day = days.includes(TODAY) ? TODAY : days.find(d => d >= TODAY) || days[days.length - 1];
    const bar = el('div', 'tabs');
    tabs(bar, days.map(d => [d, `${new Date(d + 'T12:00:00').toLocaleDateString([], {weekday: 'short', month: 'numeric', day: 'numeric'})} (${slate.events.filter(e => etDate(e.date) === d).length})`]),
      slate.day, v => { slate.day = v; renderSlate(); });
    box.appendChild(bar);
    shown = [slate.day];
  }
  shown.forEach(d => {
    box.appendChild(el('h3', 'sl-day', new Date(d + 'T12:00:00').toLocaleDateString([], {weekday: 'long', month: 'long', day: 'numeric'})));
    const grid = el('div', 'sl-grid');
    slate.events.filter(e => etDate(e.date) === d).forEach(ev => grid.appendChild(slateCard(ev)));
    box.appendChild(grid);
  });
  box.appendChild(el('p', 'foot', `Click a game for live plays and the box score. Scores and play-by-play from ESPN. Lines are ${Object.values(slate.odds)[0] && Object.values(slate.odds)[0].provider || 'sportsbook'} pre-game lines (spread, over/under, moneyline); they aren't updated during games.`));
}

// ---------------------------------------------------------------- weekly slate: game view (live plays + box score)
//
// Click a game on the slate to follow it: a play-by-play feed, newest on top, where new plays
// slide in above the old ones and nothing is removed, plus each team's box score. While the
// game is live it re-reads ESPN's game summary every 10 seconds.

const gv = {id: null, tab: 'plays', data: null, seen: new Set(), timer: null, newCount: 0, loading: false};

function gvTeams(s) {
  const comp = ((s.header || {}).competitions || [])[0] || {};
  const out = {};
  (comp.competitors || []).forEach(c => {
    const t = c.team || {};
    out[t.id] = {id: t.id, abbr: abbrOf(t.abbreviation), name: t.displayName || t.name, logo: ((t.logos || [])[0] || {}).href || t.logo,
                 score: c.score, side: c.homeAway, record: ((c.record || [])[0] || {}).summary || ((c.records || [])[0] || {}).summary};
  });
  return {teams: out, status: (comp.status || {}).type || {}, statusDetail: ((comp.status || {}).type || {}).shortDetail};
}

/** Every play so far, oldest first, as feed items (football also gets a card when a drive ends). */
function gvPlays(s, teams) {
  const items = [];
  const label = p => `${(p.period || {}).number ? (NBA ? `Q${p.period.number}` : `Q${p.period.number}`) : ''} ${(p.clock || {}).displayValue || ''}`.trim();
  if (NBA) {
    (s.plays || []).forEach(p => {
      items.push({id: p.id, team: teams[(p.team || {}).id], when: label(p), text: p.text, type: (p.type || {}).text,
                  scoring: p.scoringPlay, value: p.scoreValue, away: p.awayScore, home: p.homeScore, big: p.scoringPlay && p.scoreValue >= 3});
    });
    return items;
  }
  const drives = ((s.drives || {}).previous || []).map(d => ({d, done: true}));
  if ((s.drives || {}).current) drives.push({d: s.drives.current, done: false});
  drives.forEach(({d, done}) => {
    const team = teams[(d.team || {}).id] || Object.values(teams).find(t => t.abbr === abbrOf((d.team || {}).abbreviation));
    (d.plays || []).forEach(p => {
      const type = (p.type || {}).text || '';
      items.push({id: p.id, team, when: label(p), text: p.text, type, down: (p.start || {}).downDistanceText,
                  scoring: p.scoringPlay, turnover: p.isTurnover, yards: p.statYardage, away: p.awayScore, home: p.homeScore,
                  big: p.scoringPlay || p.isTurnover || ((p.statYardage || 0) >= 20 && /Rush|Reception|Touchdown/.test(type))});
    });
    if (done && d.displayResult) items.push({id: 'drive-' + d.id, drive: true, team, text: `${team ? team.abbr + ' ' : ''}drive: ${d.displayResult}`, sub: d.description});
  });
  return items;
}

function gvPlayNode(it, teams) {
  const sides = Object.values(teams);
  const away = sides.find(t => t.side === 'away') || {}, home = sides.find(t => t.side === 'home') || {};
  if (it.drive) {
    const n = tint(el('div', 'gv-drive'), it.team && it.team.abbr);
    n.appendChild(el('b', '', it.text));
    if (it.sub) n.appendChild(el('span', 'desc', ' · ' + it.sub));
    return n;
  }
  const n = tint(el('div', 'gv-play' + (it.big ? ' big' : '') + (it.scoring ? ' score' : '')), it.team && it.team.abbr);
  const logo = el('div', 'gv-logo');
  if (it.team && it.team.logo) { const img = el('img'); img.alt = ''; img.src = it.team.logo; img.addEventListener('error', () => img.remove()); logo.appendChild(img); }
  n.appendChild(logo);
  const body = el('div', 'gv-body');
  const meta = el('div', 'gv-meta');
  meta.appendChild(el('span', '', it.when));
  if (it.down) meta.appendChild(el('span', '', it.down));
  if (it.scoring) meta.appendChild(el('span', 'gv-tag', NBA ? `+${it.value}` : /Touchdown/.test(it.type) ? 'Touchdown' : /Field Goal/.test(it.type) ? 'Field goal' : 'Score'));
  else if (it.turnover) meta.appendChild(el('span', 'gv-tag bad', 'Turnover'));
  else if (it.big && !NBA) meta.appendChild(el('span', 'gv-tag', `${it.yards} yds`));
  body.appendChild(meta);
  body.appendChild(el('div', 'gv-text', it.text || it.type || ''));
  n.appendChild(body);
  if (it.away != null && it.home != null) n.appendChild(el('div', 'gv-score' + (it.scoring ? ' on' : ''), `${away.abbr || ''} ${it.away} – ${it.home} ${home.abbr || ''}`));
  return n;
}

/** Link a box-score name to the site's player popup when the player is on the site. */
function gvPlayerLink(name, group) {
  let sid = null;
  if (NBA) sid = PD.keys[normName(name)];
  else {
    const order = {passing: ['QB'], rushing: ['RB', 'QB', 'WR'], receiving: ['WR', 'TE', 'RB'], kicking: ['K']}[group] || ['QB', 'RB', 'WR', 'TE', 'K'];
    for (const pos of order) { sid = PD.keys[normName(name) + '|' + pos]; if (sid) break; }
  }
  return sid && P[sid] ? playerButton(sid, name) : document.createTextNode(name);
}

function gvBox(s, box) {
  const teams = (s.boxscore || {}).players || [];
  if (!teams.length) { box.appendChild(el('p', 'empty', 'Player stats show up once the game starts.')); return; }
  teams.forEach(tm => {
    const t = tm.team || {};
    const head = tint(el('div', 'gv-box-head'), abbrOf(t.abbreviation));
    const logo = ((t.logos || [])[0] || {}).href || t.logo;
    if (logo) { const img = el('img'); img.alt = ''; img.src = logo; head.appendChild(img); }
    head.appendChild(el('h3', '', t.displayName || t.abbreviation));
    box.appendChild(head);
    (tm.statistics || []).forEach(g => {
      const athletes = (g.athletes || []).filter(a => !a.didNotPlay && (a.stats || []).length);
      if (!athletes.length) return;
      if (!NBA) box.appendChild(el('div', 'gv-group', (g.text || g.name || '').replace(/^\w/, c => c.toUpperCase())));
      const rows = [];
      const addRows = (list, label) => {
        if (label && list.length) { const tr = el('tr', 'gv-sub'); const c = td(label, 'l'); c.colSpan = (g.labels || []).length + 1; tr.appendChild(c); rows.push(tr); }
        list.forEach(a => {
          const tr = el('tr');
          const c = td('', 'l');
          c.appendChild(gvPlayerLink(a.athlete.displayName, g.name));
          const pos = (a.athlete.position || {}).abbreviation;
          if (pos) c.appendChild(el('span', 'muted', ' ' + pos));
          tr.appendChild(c);
          a.stats.forEach(v => tr.appendChild(td(v)));
          rows.push(tr);
        });
      };
      if (NBA) { addRows(athletes.filter(a => a.starter), 'Starters'); addRows(athletes.filter(a => !a.starter), 'Bench'); }
      else addRows(athletes);
      let foot = null;
      if (g.totals && g.totals.some(Boolean)) { foot = el('tr'); foot.appendChild(td('Team', 'l')); g.totals.forEach(v => foot.appendChild(td(v))); }
      box.appendChild(table([['Player', 'l'], ...(g.labels || [])], rows, foot));
    });
  });
}

function gvHeader(s) {
  const {teams, status, statusDetail} = gvTeams(s);
  const head = document.getElementById('gv-head');
  head.replaceChildren();
  const sides = Object.values(teams).sort((a, b) => (a.side === 'away' ? -1 : 1));
  const sb = el('div', 'gv-scoreboard');
  sides.forEach((t, i) => {
    const side = tint(el('div', 'gv-side' + (i ? ' right' : '')), t.abbr);
    if (t.logo) { const img = el('img', 'gv-big-logo'); img.alt = ''; img.src = t.logo; side.appendChild(img); }
    const nm = el('div');
    nm.appendChild(el('div', 'gv-team-name', t.name));
    if (t.record) nm.appendChild(el('div', 'desc', t.record));
    side.appendChild(nm);
    side.appendChild(el('div', 'gv-big-score', status.state === 'pre' ? '' : String(t.score ?? '')));
    sb.appendChild(side);
    if (!i) {
      const mid = el('div', 'gv-mid');
      if (status.state === 'in') mid.appendChild(el('span', 'sl-live-dot', ''));
      mid.appendChild(el('b', '', statusDetail || ''));
      sb.appendChild(mid);
    }
  });
  head.appendChild(sb);
  const wp = (s.winprobability || []).slice(-1)[0];
  if (!NBA && wp && status.state === 'in') {
    const home = sides.find(t => t.side === 'home') || {}, away = sides.find(t => t.side === 'away') || {};
    const bar = el('div', 'sl-wp'); const f = el('span'); f.style.width = `${Math.round(100 * (1 - wp.homeWinPercentage))}%`; bar.appendChild(f);
    head.appendChild(bar);
    head.appendChild(el('div', 'desc', `Win chance: ${away.abbr} ${Math.round(100 * (1 - wp.homeWinPercentage))}% · ${home.abbr} ${Math.round(100 * wp.homeWinPercentage)}%`));
  }
  const close = el('button', 'close gv-close', '×'); close.type = 'button'; close.setAttribute('aria-label', 'Close');
  close.addEventListener('click', () => document.getElementById('gview').close());
  head.appendChild(close);
  const bar = el('div', 'tabs gv-tabs');
  tabs(bar, [['plays', 'Live plays'], ['box', 'Box score']], gv.tab, v => { gv.tab = v; gvRender(true); });
  head.appendChild(bar);
  return {teams, status};
}

/** Draw the game view. Plays are prepended as they arrive, so the feed keeps everything and your place in it. */
function gvRender(full) {
  const s = gv.data;
  const body = document.getElementById('gv-body');
  if (!s) { body.replaceChildren(el('p', 'empty', 'Loading game…')); return; }
  const {teams, status} = gvHeader(s);
  if (gv.tab === 'box') { body.replaceChildren(); gvBox(s, body); return; }
  let feed = document.getElementById('gv-feed');
  if (full || !feed) {
    body.replaceChildren();
    gv.seen = new Set();
    const pill = el('button', 'gv-new', ''); pill.type = 'button'; pill.id = 'gv-new'; pill.hidden = true;
    pill.addEventListener('click', () => { body.scrollTo({top: 0, behavior: 'smooth'}); });
    body.appendChild(pill);
    feed = el('div', 'gv-feed'); feed.id = 'gv-feed';
    body.appendChild(feed);
  }
  const items = gvPlays(s, teams);
  const fresh = items.filter(it => !gv.seen.has(it.id));
  if (!items.length && !feed.children.length) {
    const ev = slate.events.find(e => e.id === gv.id);
    feed.appendChild(el('p', 'empty', status.state === 'pre'
      ? `${NBA ? 'Tip-off' : 'Kickoff'} ${ev ? new Date(ev.date).toLocaleString([], {weekday: 'short', hour: 'numeric', minute: '2-digit'}) : 'soon'}. Plays will appear here live.`
      : 'No plays yet.'));
    return;
  }
  if (fresh.length) {
    const empty = feed.querySelector('.empty'); if (empty) empty.remove();
    const before = body.scrollHeight, scrolled = body.scrollTop > 60;
    fresh.forEach(it => {   // oldest first, each new one goes on top
      gv.seen.add(it.id);
      const node = gvPlayNode(it, teams);
      if (!full) node.classList.add('gv-in');
      feed.prepend(node);
    });
    if (scrolled && !full) {
      body.scrollTop += body.scrollHeight - before;   // keep your place while new plays land above
      gv.newCount += fresh.length;
      const pill = document.getElementById('gv-new');
      pill.textContent = `↑ ${gv.newCount} new play${gv.newCount === 1 ? '' : 's'}`;
      pill.hidden = false;
    }
  }
}

async function gvLoad() {
  if (gv.loading || !gv.id || !document.getElementById('gview').open) return;   // a refresh due as the window closes does nothing
  gv.loading = true;
  try {
    const id = gv.id;
    const s = await getJSON(`https://site.api.espn.com/apis/site/v2/sports/${SLATE_PATH}/summary?event=${id}`);
    if (gv.id !== id) return;
    const first = !gv.data;
    gv.data = s;
    gvRender(first);
    const state = (gvTeams(s).status || {}).state;
    clearTimeout(gv.timer);
    if (state !== 'post' && document.getElementById('gview').open) gv.timer = setTimeout(gvLoad, state === 'in' ? 10000 : 60000);
  } catch (e) {
    if (!gv.data) document.getElementById('gv-body').replaceChildren(el('p', 'err', 'Couldn\'t load this game from ESPN. Try again in a moment.'));
    clearTimeout(gv.timer);
    if (document.getElementById('gview').open) gv.timer = setTimeout(gvLoad, 15000);
  } finally { gv.loading = false; }
}

function openGame(id) {
  const dlg = document.getElementById('gview');
  clearTimeout(gv.timer);
  Object.assign(gv, {id: String(id), tab: 'plays', data: null, seen: new Set(), newCount: 0});
  document.getElementById('gv-head').replaceChildren();
  gvRender(true);
  if (!dlg.open) dlg.showModal();
  gvLoad();
}

document.getElementById('gview').addEventListener('close', () => { clearTimeout(gv.timer); gv.id = null; });
document.getElementById('gview').addEventListener('click', e => { if (e.target.id === 'gview') e.target.close(); });
document.getElementById('gv-body').addEventListener('scroll', e => {
  if (e.target.scrollTop < 30) { gv.newCount = 0; const p = document.getElementById('gv-new'); if (p) p.hidden = true; }
});

// ---------------------------------------------------------------- live fantasy matchups

const leagueLive = {at: null, busy: false, players: {}, unsupported: false};

async function liveLeagueRefresh() {
  const ctx = leagueCtx;
  if (!ctx || leagueLive.busy || !weekUnderway()) return;
  if (leagueLive.at && Date.now() - leagueLive.at < 55000 && leagueLive.key === ctx.active.key) return;   // at most once a minute
  leagueLive.key = ctx.active.key;
  const {L, active} = ctx;
  const w = curWeek(L);
  if (!(active.key.startsWith('sleeper:') || active.key.startsWith('espn:'))) { leagueLive.unsupported = true; return; }
  leagueLive.busy = true;
  try {
    if (active.key.startsWith('sleeper:')) {
      const rows = await getJSON(`${SLEEPER}/league/${active.key.slice(8)}/matchups/${w}`);
      const byRoster = Object.fromEntries(rows.map(r => [r.roster_id, r]));
      L.schedule.filter(m => m.week === w).forEach(m => {
        if (byRoster[m.a]) m.ap = byRoster[m.a].points || 0;
        if (byRoster[m.b]) m.bp = byRoster[m.b].points || 0;
      });
      rows.forEach(r => {
        leagueLive.players[r.roster_id] = r.players_points || {};
        const t = L.teams.find(x => x.id === r.roster_id);
        if (t && r.starters) t.current = L.slots.map((slot, i) => ({slot, pl: r.starters[i] && r.starters[i] !== '0' ? sleeperPlayer(r.starters[i]) : null}));
      });
    } else {
      const fresh = await loadEspn(active.key.slice(5));
      fresh.schedule.filter(m => m.week === w).forEach(f => {
        const m = L.schedule.find(x => x.week === w && x.a === f.a && x.b === f.b);
        if (m) { m.ap = f.ap; m.bp = f.bp; }
      });
      fresh.teams.forEach(f => { const t = L.teams.find(x => x.id === f.id); if (t) t.current = f.current; });
    }
    leagueLive.at = new Date();
    L._fp = new Map(); L._rv = new Map();
    if (view === 'league' && ['overview', 'matchup'].includes(leagueSub)) renderLeague();
  } catch (e) { /* try again next tick */ } finally { leagueLive.busy = false; }
}

/** Football, once games start: the lineup each manager actually set, with live points and what's left to play. */
function liveBreakdown(L, team, w) {
  const pts = leagueLive.players[team.id] || {};
  const rows = team.current.filter(c => SLOT_ELIG[c.slot]).map(c => {
    const pl = c.pl;
    const s = pl ? teamLive((P[pl.sid] || {}).t || pl.team) : null;
    return {slot: c.slot, pl, pts: pl ? proj(pl, w, true) : 0, live: pl && pl.sid in pts ? pts[pl.sid] : null, status: s ? s.detail : (pl ? 'BYE' : '')};
  });
  const starting = new Set(rows.filter(r => r.pl).map(r => plKey(r.pl)));
  return {rows, bench: team.players.filter(pl => !starting.has(plKey(pl))).map(pl => ({pl, pts: proj(pl, w, true)})),
          total: rows.reduce((s, r) => s + r.pts, 0), live: true};
}

// ---------------------------------------------------------------- leagues: connecting

let showConnect = false;
document.getElementById('addLeague').addEventListener('click', () => { showConnect = !showConnect; renderLeague(); });
document.getElementById('leagueSel').addEventListener('change', e => { const s = store.get(); s.active = e.target.value; store.set(s); renderLeague(); });
document.getElementById('removeLeague').addEventListener('click', () => {
  const s = store.get();
  const key = document.getElementById('leagueSel').value;
  if (key.startsWith('sleeper:')) {
    if (!confirm(`Disconnect Sleeper user ${s.sleeper ? s.sleeper.username : ''} and all of their leagues?`)) return;
    delete s.sleeper; sleeperLeagues = [];
  } else if (key.startsWith('espn:')) {
    s.espn = (s.espn || []).filter(e => 'espn:' + e.id !== key);
  }
  delete s.active; store.set(s); renderLeague();
});

function showErr(id, msg) { const e = document.getElementById(id); e.textContent = msg || ''; e.hidden = !msg; }

document.getElementById('sleeperForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = e.target.querySelector('button'); btn.disabled = true; showErr('sleeperErr', '');
  const username = document.getElementById('sleeperUser').value.trim();
  try {
    const user = await getJSON(`${SLEEPER}/user/${encodeURIComponent(username)}`);
    if (!user || !user.user_id) throw new Error(`No Sleeper user named "${username}".`);
    const s = store.get();
    s.sleeper = {username: user.username || username, user_id: user.user_id};
    store.set(s);
    await refreshSleeperLeagues();
    if (!sleeperLeagues.length) throw new Error(`${s.sleeper.username} has no ${D.season} NFL leagues on Sleeper.`);
    s.active = 'sleeper:' + sleeperLeagues[0].league_id; store.set(s);
    showConnect = false; e.target.reset(); renderLeague();
  } catch (err) {
    showErr('sleeperErr', err.message);
  } finally { btn.disabled = false; }
});

document.getElementById('espnForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = e.target.querySelector('button'); btn.disabled = true; showErr('espnErr', '');
  const text = document.getElementById('espnId').value.trim();
  const id = (text.match(/leagueId=(\d+)/) || text.match(/^(\d+)$/) || [])[1];
  try {
    if (!id) throw new Error('Enter the number after leagueId= in your ESPN league URL.');
    const L = await loadEspn(id);
    const s = store.get();
    s.espn = (s.espn || []).filter(x => x.id !== id).concat([{id, name: L.name}]);
    s.active = 'espn:' + id; store.set(s);
    loaded['espn:' + id] = Promise.resolve(L);
    showConnect = false; e.target.reset(); renderLeague();
  } catch (err) {
    showErr('espnErr', err.message);
  } finally { btn.disabled = false; }
});

// ---------------------------------------------------------------- start

(function init() {
  const when = new Date(D.generated);
  document.getElementById('sub').textContent = NBA
    ? `Average of expert, projection and form rankings · ${D.season_label} season · Week ${D.week}`
    : `Average of expert and market rankings · Season ${D.season} · upcoming week ${D.week}`;
  if (NBA) {
    document.getElementById('title').replaceChildren(document.createTextNode('Fantasy basketball '), el('span', '', '· Points'));
    document.title = 'Fantasy Basketball';
  }
  const sport = document.getElementById('sport');
  [['football', '🏈 Football'], ['basketball', '🏀 Basketball']].forEach(([k, label]) => {
    const a = el('a', '', label);
    a.href = (D.links || {})[k] || '#';
    if ((D.sport || 'football') === k) a.setAttribute('aria-current', 'page');
    sport.appendChild(a);
  });
  const banner = document.getElementById('banner');
  banner.hidden = !D.demo;
  if (D.demo) banner.textContent = 'Demo data: these are made-up players and a made-up league used to test the site, not real rankings.';
  const gen = [`Updated ${when.toLocaleString([], {dateStyle: 'medium', timeStyle: 'short'})}.`];
  if ((PD.failed || []).length) gen.push(`Some player data was unavailable: ${PD.failed.join(', ')}.`);
  document.getElementById('gen').textContent = gen.join(' ');
  renderRankings();
  const h = readHash();
  if (SUBS.some(([k]) => k === h.sub)) leagueSub = h.sub;
  show(h.view);
  if (h.player) openPlayer(h.player, false);
  refreshSlate();
})();
