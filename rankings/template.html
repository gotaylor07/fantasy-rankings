<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy Rankings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f8;--bg-glow-1:rgba(27,110,243,.16);--bg-glow-2:rgba(22,160,133,.12);
  --card:#ffffff;--card-2:#f7f9fc;--text:#111827;--muted:#64748b;--line:#e2e8f0;
  --accent:#1d63ed;--accent-2:#0ea5a4;--accent-text:#fff;--row:#f8fafc;--hover:#eef4ff;
  --warn-bg:#fff4d6;--warn-text:#7a5200;--good:#15803d;--bad:#c2261d;--chg:#e8f0ff;
  --backdrop:rgba(15,23,42,.5);--shadow:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.06);
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0b1017;--bg-glow-1:rgba(76,141,255,.16);--bg-glow-2:rgba(20,184,166,.10);
  --card:#141b25;--card-2:#18212d;--text:#e8edf4;--muted:#8e9aab;--line:#243042;
  --accent:#5b9bff;--accent-2:#2dd4bf;--accent-text:#08111f;--row:#161e29;--hover:#1b2636;
  --warn-bg:#3a2f0b;--warn-text:#f6dc8f;--good:#4ade80;--bad:#ff7b72;--chg:#18294a;
  --backdrop:rgba(0,0,0,.65);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(900px 500px at 8% -10%,var(--bg-glow-1),transparent 70%),radial-gradient(800px 500px at 100% 0%,var(--bg-glow-2),transparent 70%),var(--bg);background-attachment:fixed;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1020px;margin:0 auto;padding:24px 16px 56px}
.hero{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.sport{margin-left:auto;display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow)}
.sport a{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
.sport a:hover{color:var(--text)}
.sport a[aria-current=page]{color:var(--accent-text);background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--accent-2)))}
.logo{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 18px var(--bg-glow-1)}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0}
h1 span{color:var(--muted);font-weight:600}
h2{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px}
h3{font-size:14px;margin:16px 0 6px}
.sub{color:var(--muted);margin:2px 0 0;font-size:13px}
.banner{background:var(--warn-bg);color:var(--warn-text);padding:9px 13px;border-radius:10px;margin-bottom:14px;font-size:13px}
.nav{display:inline-flex;gap:4px;padding:4px;margin-bottom:18px;background:var(--card);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow)}
.nav button{border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:8px 18px;border-radius:999px;cursor:pointer}
.nav button:hover{color:var(--text)}
.nav button[aria-selected=true]{color:var(--accent-text);background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--accent-2)))}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 14px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px;font-weight:500;transition:background .15s,border-color .15s}
.tab:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.tab[aria-pressed=true]{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:6px 0 12px}
input[type=search],input[type=text],select{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px;border-radius:10px;font:inherit;min-width:0}
input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--accent) 50%,transparent);outline-offset:1px}
input[type=search]{min-width:220px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-text);padding:8px 14px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--card);color:var(--text);border-color:var(--line);font-weight:500}
.btn.ghost:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.btn:disabled{opacity:.6;cursor:default}
.desc{color:var(--muted);font-size:13px}
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;box-shadow:var(--shadow)}
.tablewrap.tall{max-height:75vh}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:right;white-space:nowrap}
th.l,td.l{text-align:left}
th{position:sticky;top:0;z-index:1;background:var(--card-2);font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line)}
tbody tr{border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
tbody tr:last-child{border-bottom:0}
tbody tr:hover td{background:var(--hover)}
tfoot td{border-top:1px solid var(--line);font-weight:600;background:var(--card-2)}
td{font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:160px}
.rank{color:var(--muted);width:44px}
.avg{font-weight:700}
.muted{color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.foot{color:var(--muted);font-size:12px;margin-top:14px}
.good{color:var(--good)}
.bad{color:var(--bad)}
td.good b,td.bad b{color:inherit}
.plink{border:0;background:none;color:inherit;font:inherit;font-weight:600;padding:0;cursor:pointer;text-align:left}
.plink:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:1px;background:var(--row);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.badge.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:color-mix(in srgb,var(--bad) 9%,transparent)}
.badge.warn{color:var(--warn-text);background:var(--warn-bg);border-color:transparent}
/* Player tag: face, name, team chip tinted with the team's main color */
.ptag{display:inline-flex;align-items:center;gap:7px;vertical-align:middle;max-width:100%}
.face{flex:none;width:26px;height:26px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--muted);
  background:color-mix(in srgb,var(--tc,#888) 22%,var(--card));border:1.5px solid color-mix(in srgb,var(--tc,#888) 55%,transparent)}
.face img{width:100%;height:100%;object-fit:cover}
.team-chip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:1px 6px;border-radius:6px;color:var(--text);
  background:color-mix(in srgb,var(--tc,#888) 16%,transparent);border:1px solid color-mix(in srgb,var(--tc,#888) 45%,transparent)}
.ptag .pos{font-size:12px;color:var(--muted)}
.opp-chip{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:1px 6px;border-radius:6px;color:var(--muted);background:var(--row);border:1px solid var(--line);white-space:nowrap}
.ptag .badge{margin-left:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.section{margin-bottom:26px}
.section > .desc{margin:0 0 10px}
.connect{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.connect form{display:flex;gap:8px;margin-top:8px}
.connect form input{flex:1}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}
.err{color:var(--bad);font-size:13px;margin:6px 0 0}
.leaguebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.leaguebar select{flex:1;min-width:200px}
.chg td{background:var(--chg)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.stat{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:9px 13px;min-width:96px}
.stat b{display:block;font-size:19px;letter-spacing:-.01em}
.stat span{font-size:12px;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--text);padding:0;width:min(880px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:var(--backdrop);backdrop-filter:blur(3px)}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:18px 18px 0;position:relative}
.dlg-head::before{content:"";position:absolute;inset:0 0 auto 0;height:86px;border-radius:18px 18px 0 0;background:linear-gradient(135deg,color-mix(in srgb,var(--tc,var(--accent)) 30%,transparent),transparent 75%);pointer-events:none}
.dlg-head > *{position:relative}
.dlg-body{padding:0 18px 18px}
.pl-photo{flex:none;width:108px;height:108px;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--tc,#888) 20%,var(--card));border:2px solid color-mix(in srgb,var(--tc,#888) 55%,transparent)}
.pl-photo img{width:100%;height:100%;object-fit:cover}
.pl-photo.none span{font-size:28px;font-weight:700;color:var(--muted)}
.pl-info{flex:1;min-width:0}
.pl-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pl-bio{margin:6px 0 10px;font-size:14px}
.facts{display:flex;flex-wrap:wrap;gap:8px 20px;margin:0 0 6px}
.facts dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.facts dd{margin:0;font-weight:600;font-size:14px}
.injury{margin:4px 0 8px;padding:9px 12px;border-radius:12px;font-size:13px;background:color-mix(in srgb,var(--bad) 8%,transparent);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.injury.q{background:var(--warn-bg);border-color:transparent;color:var(--warn-text)}
.injury b{font-weight:700}
.dlg-body .tabs{margin-top:16px}
.close{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;width:34px;height:34px;font-size:18px;cursor:pointer;flex:none}
.trade-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.checklist{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);margin:0;padding:8px 10px 10px;max-height:380px;overflow:auto;min-width:0;box-shadow:var(--shadow)}
.checklist legend{font-weight:700;padding:0 4px}
.check{display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.check:last-child{border-bottom:0}
.check .val{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.verdict{margin:14px 0 6px}
/* Games: Blind Rank */
.g-hero{margin-bottom:14px}
.g-title{font-size:30px;font-weight:800;letter-spacing:-.03em;background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
.g-setup h2{margin-top:2px}
.g-sub{margin-top:14px !important}
.g-start-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.btn.g-go{padding:11px 26px;font-size:16px;border-radius:12px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--accent-2)));border:0;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 35%,transparent);transition:transform .12s}
.btn.g-go:hover:not(:disabled){transform:translateY(-1px)}
.g-stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}
.g-left{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;box-shadow:var(--shadow);position:sticky;top:12px}
.g-dots{display:flex;gap:8px}
.g-dots span{width:10px;height:10px;border-radius:50%;background:var(--line)}
.g-dots span.done{background:var(--accent)}
.g-dots span.now{background:var(--accent-2);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent-2) 25%,transparent)}
.g-card{display:flex;align-items:center;gap:12px;text-align:left;min-width:0}
.g-card .pl-photo{width:44px;height:44px;border-radius:12px;border-width:1.5px}
.g-card .pl-photo.none span{font-size:15px}
.g-card-info{min-width:0}
.g-card-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-card.big{flex-direction:column;text-align:center;gap:10px;padding:18px 22px;border-radius:18px;width:100%;max-width:340px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--tc,var(--accent)) 26%,var(--card)),var(--card) 70%);border:1px solid color-mix(in srgb,var(--tc,var(--accent)) 45%,var(--line))}
.g-card.big .pl-photo{width:150px;height:150px;border-radius:20px}
.g-card.big .g-card-name{font-size:24px;white-space:normal}
.g-card.big .pl-meta{justify-content:center}
.g-hint{margin-top:6px}
.g-enter{animation:g-pop .38s cubic-bezier(.2,.9,.3,1.3)}
@keyframes g-pop{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
.g-right{min-width:0}
.g-ladder-head{font-weight:700;margin-bottom:4px}
.g-ends{font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:4px 0}
.g-ladder{display:flex;flex-direction:column;gap:10px}
.g-slot{display:flex;align-items:center;gap:14px;min-height:70px;padding:10px 14px;border-radius:14px;border:2px dashed var(--line);background:var(--card);color:var(--text);font:inherit;text-align:left;width:100%}
button.g-slot{cursor:pointer;transition:border-color .15s,background .15s,transform .12s}
button.g-slot:hover,button.g-slot:focus-visible{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--card));transform:translateX(3px);outline:none}
.g-slot.filled{border-style:solid;box-shadow:var(--shadow);animation:g-pop .3s ease-out}
.g-num{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:18px;background:var(--card-2);border:1px solid var(--line)}
.g-slot.filled .g-num{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border:0}
.g-empty{color:var(--muted);font-size:14px}
.g-slot .g-card{flex:1}
.g-result{margin-left:auto;text-align:right;display:flex;flex-direction:column;flex:none}
.g-slot.exact{border-color:color-mix(in srgb,var(--good) 70%,transparent);background:color-mix(in srgb,var(--good) 8%,var(--card))}
.g-slot.close{border-color:color-mix(in srgb,#f59e0b 70%,transparent);background:color-mix(in srgb,#f59e0b 8%,var(--card))}
.g-slot.miss{border-color:color-mix(in srgb,var(--bad) 60%,transparent);background:color-mix(in srgb,var(--bad) 7%,var(--card))}
.g-slot.exact .g-result b{color:var(--good)}
.g-slot.miss .g-result b{color:var(--bad)}
.g-ring{--pct:0;width:170px;height:170px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--pct) * 1%),var(--line) 0)}
.g-ring::before{content:"";grid-area:1/1;width:136px;height:136px;border-radius:50%;background:var(--card)}
.g-ring-num{grid-area:1/1;font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.g-verdict{font-size:22px;font-weight:800}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:g-fall linear forwards}
.d-head{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.d-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.d-respin{font-weight:600}
.d-prog{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.d-prog span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .3s}
.d-needs{display:flex;flex-wrap:wrap;gap:6px}
.d-need{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.d-need b{margin-right:2px}
.d-need.full{opacity:.45;text-decoration:line-through}
.d-offer{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:20px}
.d-pick{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:center;border-radius:18px;transition:transform .15s}
.d-pick:hover,.d-pick:focus-visible{transform:translateY(-4px);outline:none}
.d-pick:hover .g-card,.d-pick:focus-visible .g-card{border-color:var(--accent);box-shadow:0 10px 28px color-mix(in srgb,var(--accent) 30%,transparent)}
.d-pick .g-card.big{max-width:none;height:100%;padding:14px 10px}
.d-pick .g-card.big .pl-photo{width:96px;height:96px}
.d-pick .g-card.big .g-card-name{font-size:16px}
.d-for{font-size:12px;font-weight:600;color:var(--accent);margin-top:auto}
.d-roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px}
.d-roster-row{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.d-roster-row .desc{margin-left:auto}
.d-roster-pos{font-weight:700;font-size:12px;color:var(--muted);width:44px}
.d-roster-row.open{border-style:dashed;background:none}
.who-mystery{font-size:40px !important;color:var(--muted)}
.who-form{display:flex;flex-direction:column;gap:14px;margin:0}
.combo{position:relative;display:flex;flex-direction:column;gap:6px}
.combo-label{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.combo input,.combo select{font-size:16px;padding:11px 14px;border-radius:12px}
.combo input:disabled,.combo select:disabled{opacity:.75}
.combo-list{position:absolute;top:100%;left:0;right:0;z-index:20;margin:4px 0 0;padding:4px;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.25);max-height:280px;overflow:auto}
.combo-list li{padding:9px 12px;border-radius:8px;cursor:pointer}
.combo-list li.on,.combo-list li:hover{background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.combo-list li b{color:var(--accent)}
.who-feedback{display:flex;flex-direction:column;gap:6px}
.who-fb{padding:9px 12px;border-radius:10px;font-size:14px}
.who-fb.ok{background:color-mix(in srgb,var(--good) 12%,var(--card));border:1px solid color-mix(in srgb,var(--good) 45%,transparent)}
.who-fb.no{background:color-mix(in srgb,var(--bad) 10%,var(--card));border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.who-fb.ok b{color:var(--good)}
.who-fb.no b{color:var(--bad)}
.sl-live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ef4444;margin-right:6px;vertical-align:1px;box-shadow:0 0 0 0 rgba(239,68,68,.6);animation:sl-pulse 1.6s infinite}
@keyframes sl-pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.55)}70%{box-shadow:0 0 0 8px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
.sl-ticker{margin:4px 0 18px;min-height:104px}
.sl-tk-card{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:18px;border:1px solid color-mix(in srgb,var(--tc,var(--accent)) 45%,var(--line));
  background:linear-gradient(120deg,color-mix(in srgb,var(--tc,var(--accent)) 24%,var(--card)),var(--card) 65%);box-shadow:var(--shadow);animation:g-pop .45s ease-out}
.sl-tk-pic{flex:none;width:72px;height:72px;border-radius:16px;overflow:hidden;display:grid;place-items:center;background:var(--card-2);border:1px solid var(--line)}
.sl-tk-pic img{width:100%;height:100%;object-fit:cover}

<body>
<div class="wrap">
  <header class="hero">
    <div class="logo" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><ellipse cx="12" cy="12" rx="10" ry="6.2" transform="rotate(-35 12 12)"/><path d="M9 15l6-6M10.5 10.5l1.5 1.5M12 9l1.5 1.5M9 12l1.5 1.5"/></svg>
    </div>
    <div>
      <h1 id="title">Fantasy rankings <span>· Full PPR</span></h1>
      <p class="sub" id="sub"></p>
    </div>
    <nav class="sport" id="sport" aria-label="Sport"></nav>
  </header>
  <div class="banner" id="banner" hidden></div>
  <div class="nav" role="tablist">
    <button type="button" role="tab" id="nav-rankings" aria-controls="view-rankings">Player rankings</button>
    <button type="button" role="tab" id="nav-slate" aria-controls="view-slate">Weekly slate</button>
    <button type="button" role="tab" id="nav-league" aria-controls="view-league">My league</button>
    <button type="button" role="tab" id="nav-games" aria-controls="view-games">Games</button>
  </div>

  <section id="view-rankings" role="tabpanel" aria-labelledby="nav-rankings">
    <div class="tabs" id="types" role="group" aria-label="Ranking type"></div>
    <div class="tabs" id="positions" role="group" aria-label="Position"></div>
    <div class="tools">
      <span class="desc" id="desc"></span>
      <input type="search" id="q" placeholder="Search players" aria-label="Search players">
    </div>
    <div class="tablewrap tall"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    <p class="foot" id="foot"></p>
  </section>

  <section id="view-slate" role="tabpanel" aria-labelledby="nav-slate" hidden>
    <div id="slateBody"></div>
  </section>

  <section id="view-league" role="tabpanel" aria-labelledby="nav-league" hidden>
    <div class="leaguebar" id="leaguebar" hidden>
      <select id="leagueSel" aria-label="League"></select>
      <button type="button" class="btn ghost" id="addLeague">Add league</button>
      <button type="button" class="btn ghost" id="removeLeague">Disconnect</button>
    </div>
    <div class="card" id="connect" hidden>
      <h2>Connect a league</h2>
      <div class="connect">
        <div>
          <strong>Sleeper</strong>
          <form id="sleeperForm">
            <input type="text" id="sleeperUser" placeholder="Sleeper username" aria-label="Sleeper username" autocomplete="username" required>
            <button class="btn" type="submit">Connect</button>
          </form>
          <p class="note">Sleeper's public API only needs your username. No password is asked for or stored.</p>
          <p class="err" id="sleeperErr" hidden></p>
        </div>
        <div>
          <strong>ESPN</strong>
          <form id="espnForm">
            <input type="text" id="espnId" placeholder="League ID or league URL" aria-label="ESPN league ID or URL" required>
            <button class="btn" type="submit">Connect</button>
          </form>
          <p class="note">Works here for public leagues. For a private league, run <code>python3 update.py --espn-login</code>: it opens ESPN so you can sign in, then adds your leagues here.</p>
          <p class="err" id="espnErr" hidden></p>
        </div>
      </div>
    </div>
    <div id="leagueBody"></div>
  </section>

  <section id="view-games" role="tabpanel" aria-labelledby="nav-games" hidden>
    <div id="gamesBody"></div>
  </section>
  <p class="foot" id="gen"></p>
</div>

<dialog id="gview" class="gview" aria-label="Game">

</dialog>

<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const PD = D.players || {};
const P = PD.players || {};
const FIELDS = PD.fields || [];
const F = Object.fromEntries(FIELDS.map((f, i) => [f, i + 4]));   // log row: [week, opp, ppr, snap%, ...FIELDS]
const BYES = PD.byes || {};
const KINDS = ['week', 'ros', 'dynasty'];
const NBA = D.sport === 'basketball';
const POS = NBA ? ['ALL', 'PG', 'SG', 'SF', 'PF', 'C'] : ['QB', 'RB', 'WR', 'TE'];
const LAST_DONE = D.week - 1;
let view = 'rankings', kind = 'week', pos = POS[0], query = '';

// ---------------------------------------------------------------- helpers

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}

function td(text, cls) { return el('td', cls, text); }

function table(headers, rows, foot) {
  const wrap = el('div', 'tablewrap');
  const t = el('table');
  const thead = el('thead'); const hr = el('tr');
  headers.forEach(h => {
    const [label, cls] = Array.isArray(h) ? h : [h, ''];
    hr.appendChild(el('th', cls, label));
  });
  thead.appendChild(hr); t.appendChild(thead);
  const tb = el('tbody'); rows.forEach(r => tb.appendChild(r)); t.appendChild(tb);
  if (foot) { const tf = el('tfoot'); tf.appendChild(foot); t.appendChild(tf); }
  wrap.appendChild(t);
  return wrap;
}

function fmt(n, d = 1) { return (n === null || n === undefined || Number.isNaN(n)) ? '–' : Number(n).toFixed(d); }

function tabs(container, items, current, onPick) {
  container.replaceChildren();
  items.forEach(([value, label]) => {
    const b = el('button', 'tab', label);
    b.type = 'button';
    b.setAttribute('aria-pressed', String(value === current));
    b.addEventListener('click', () => onPick(value));
    container.appendChild(b);
  });
}

const store = {
  // Each sport remembers its own connected leagues.
  key: D.sport === 'basketball' ? 'fr-leagues-nba-v1' : 'fr-leagues-v1',
  get() { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },
  set(v) { try { localStorage.setItem(this.key, JSON.stringify(v)); } catch (e) { /* private window: not remembered */ } },
};

// Same normalisation as rankings/aggregate.py norm_name, for matching ESPN roster names.
const SUFFIXES = new Set((D.names || {}).suffixes || []);
const ALIASES = (D.names || {}).aliases || {};
function normName(name) {
  let n = name.normalize('NFKD').replace(/[^\x00-\x7f]/g, '').toLowerCase();
  n = n.replace(/[.'`-]/g, '').replace(/[^a-z0-9 ]/g, ' ');
  n = n.split(/\s+/).filter(p => p && !SUFFIXES.has(p)).join(' ');
  return ALIASES[n] || n;
}

// ---------------------------------------------------------------- player game log

function playerButton(sid, name) {
  if (!sid || !P[sid]) return document.createTextNode(name);
  const b = el('button', 'plink', name);
  b.type = 'button';
  b.addEventListener('click', () => openPlayer(sid));
  return b;
}

// ---------------------------------------------------------------- player tags: face, team chip, injury

// Each team's main color, and a lighter one where the main color is too dark to show on a dark background.
const NFL_TEAM_COLORS = {
  ARI: ['#97233F', '#C8344F'], ATL: ['#A71930', '#D02B46'], BAL: ['#241773', '#7B62E8'], BUF: ['#00338D', '#3A7BEA'],
  CAR: ['#0085CA', '#0085CA'], CHI: ['#0B162A', '#C83803'], CIN: ['#FB4F14', '#FB4F14'], CLE: ['#FF3C00', '#FF3C00'],
  DAL: ['#003594', '#869397'], DEN: ['#FB4F14', '#FB4F14'], DET: ['#0076B6', '#0076B6'], GB: ['#203731', '#FFB612'],
  HOU: ['#03202F', '#A71930'], IND: ['#002C5F', '#4D84C4'], JAX: ['#006778', '#11A3B8'], KC: ['#E31837', '#E31837'],
  LV: ['#000000', '#A5ACAF'], LAC: ['#0080C6', '#0080C6'], LAR: ['#003594', '#FFA300'], MIA: ['#008E97', '#00B1BA'],
  MIN: ['#4F2683', '#8F63CF'], NE: ['#002244', '#C60C30'], NO: ['#D3BC8D', '#D3BC8D'], NYG: ['#0B2265', '#A71930'],
  NYJ: ['#125740', '#2E9E6E'], PHI: ['#004C54', '#1C8A96'], PIT: ['#FFB612', '#FFB612'], SF: ['#AA0000', '#D43030'],
  SEA: ['#002244', '#69BE28'], TB: ['#D50A0A', '#D50A0A'], TEN: ['#4B92DB', '#4B92DB'], WAS: ['#5A1414', '#FFB612'],
};
const NBA_TEAM_COLORS = {
  ATL: ['#E03A3E', '#E03A3E'], BOS: ['#007A33', '#2BA35A'], BKN: ['#000000', '#A1A1A4'], CHA: ['#1D1160', '#00788C'],
  CHI: ['#CE1141', '#CE1141'], CLE: ['#860038', '#FDBB30'], DAL: ['#00538C', '#2E86D1'], DEN: ['#0E2240', '#FEC524'],
  DET: ['#C8102E', '#C8102E'], GSW: ['#1D428A', '#FFC72C'], HOU: ['#CE1141', '#CE1141'], IND: ['#002D62', '#FDBB30'],
  LAC: ['#C8102E', '#C8102E'], LAL: ['#552583', '#FDB927'], MEM: ['#5D76A9', '#7D95C8'], MIA: ['#98002E', '#D4263F'],
  MIL: ['#00471B', '#2E8B57'], MIN: ['#0C2340', '#78BE20'], NOP: ['#0C2340', '#C8102E'], NYK: ['#006BB6', '#F58426'],
  OKC: ['#007AC1', '#EF3B24'], ORL: ['#0077C0', '#0077C0'], PHI: ['#006BB6', '#ED174C'], PHX: ['#1D1160', '#E56020'],
  POR: ['#E03A3E', '#E03A3E'], SAC: ['#5A2D81', '#8E5BBF'], SAS: ['#C4CED4', '#C4CED4'], TOR: ['#CE1141', '#CE1141'],
  UTA: ['#002B5C', '#F9A01B'], WAS: ['#002B5C', '#E31837'],
};
const NBA_TEAM_NAMES = {
  ATL: 'Atlanta Hawks', BOS: 'Boston Celtics', BKN: 'Brooklyn Nets', CHA: 'Charlotte Hornets', CHI: 'Chicago Bulls',
  CLE: 'Cleveland Cavaliers', DAL: 'Dallas Mavericks', DEN: 'Denver Nuggets', DET: 'Detroit Pistons', GSW: 'Golden State Warriors',
  HOU: 'Houston Rockets', IND: 'Indiana Pacers', LAC: 'LA Clippers', LAL: 'Los Angeles Lakers', MEM: 'Memphis Grizzlies',
  MIA: 'Miami Heat', MIL: 'Milwaukee Bucks', MIN: 'Minnesota Timberwolves', NOP: 'New Orleans Pelicans', NYK: 'New York Knicks',
  OKC: 'Oklahoma City Thunder', ORL: 'Orlando Magic', PHI: 'Philadelphia 76ers', PHX: 'Phoenix Suns', POR: 'Portland Trail Blazers',
  SAC: 'Sacramento Kings', SAS: 'San Antonio Spurs', TOR: 'Toronto Raptors', UTA: 'Utah Jazz', WAS: 'Washington Wizards',
};
const TEAM_COLORS = NBA ? NBA_TEAM_COLORS : NFL_TEAM_COLORS;
const darkMode = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : {matches: false};
const teamColor = team => (TEAM_COLORS[team] || [])[darkMode.matches ? 1 : 0] || null;
function tint(node, team) { const c = teamColor(team); if (c) node.style.setProperty('--tc', c); return node; }

function imageFor(sid, pos, team, thumb) {
  if (D.demo || !sid) return null;
  if (pos === 'DEF') return team ? `https://sleepercdn.com/images/team_logos/nfl/${String(team).toLowerCase()}.png` : null;
  return `https://sleepercdn.com/content/${NBA ? 'nba' : 'nfl'}/players/${thumb ? 'thumb/' : ''}${encodeURIComponent(sid)}.jpg`;
}

const initialsOf = (name, pos, team) => pos === 'DEF' ? (team || '') : name.split(/\s+/).filter(w => /^[A-Za-z]/.test(w)).map(w => w[0]).slice(0, 2).join('');

function face(sid, name, pos, team) {
  const box = tint(el('span', 'face'), team);
  const src = imageFor(sid, pos, team, true);
  const fallback = () => box.replaceChildren(document.createTextNode(initialsOf(name, pos, team)));
  if (!src) { fallback(); return box; }
  const img = el('img');
  img.alt = ''; img.loading = 'lazy'; img.decoding = 'async'; img.src = src;
  img.addEventListener('error', fallback);
  box.appendChild(img);
  return box;
}

function teamChip(team) {
  if (!team) return null;
  const c = tint(el('span', 'team-chip', team), team);
  c.title = teamFullName(team);
  return c;
}

const shortDate = iso => { const d = new Date(String(iso).slice(0, 10) + 'T12:00:00'); return isNaN(d) ? null : d.toLocaleDateString([], {month: 'short', day: 'numeric'}); };

/** Injury details from ESPN's report when they describe the same status we're showing. */
function injuryDetail(sid, status) {
  const i = sid && P[sid] && P[sid].inj;
  return i && i.s === status ? i : null;
}

function injuryBadge(status, sid) {
  if (!status) return null;
  const s = String(status);
  const short = {Questionable: 'Q', Doubtful: 'D', Out: 'Out', IR: 'IR', PUP: 'PUP', Sus: 'SUS', NA: 'NA', DTD: 'DTD', Probable: 'P'}[s] || s;
  const d = injuryDetail(sid, s);
  let text = short;
  if (d && d.play != null && ['Questionable', 'Doubtful', 'DTD', 'Probable'].includes(s)) text += ` · ${d.play}%`;
  else if (d && d.ret && shortDate(d.ret)) text += ` · back ${shortDate(d.ret)}`;
  const b = el('span', 'badge ' + (s === 'Questionable' ? 'warn' : 'bad'), text);
  const tip = [s + (d && d.type ? ` (${d.type})` : '')];
  if (d && d.play != null) tip.push(`Estimated ${d.play}% chance to play ${NBA ? 'in the next game' : `in Week ${D.week}`}`);
  if (d && d.ret) tip.push(`Expected return: ${shortDate(d.ret)}`);
  if (d && d.note) tip.push(d.note);
  b.title = tip.join('\n');
  return b;
}

/** Face, name (opens the player popup unless link is false), team chip, position and injury badge. */
function nameTag(pl, {link = true, pos = true, opp = null} = {}) {
  const sid = pl.sid;
  const team = pl.team || (sid && P[sid] ? P[sid].t : '');
  const position = pl.pos || (sid && P[sid] ? P[sid].p : '');
  const tag = el('span', 'ptag');
  tag.appendChild(face(sid, pl.name, position, team));
  tag.appendChild(link ? playerButton(sid, pl.name) : el('span', '', pl.name));
  const chip = teamChip(team); if (chip) tag.appendChild(chip);
  if (opp) tag.appendChild(el('span', 'opp-chip', opp));
  const elig = pl.el || (sid && P[sid] ? P[sid].el : null);
  if (pos && position) tag.appendChild(el('span', 'pos', NBA && elig ? elig.join('/') : posLabel(position)));
  const status = pl.inj !== undefined ? pl.inj : (sid && P[sid] ? P[sid].i : null);
  const inj = injuryBadge(status, sid); if (inj) tag.appendChild(inj);
  return tag;
}


const LOG_COLS = {
  QB: [['Cmp/Att', g => `${g[F.pass_cmp]}/${g[F.pass_att]}`], ['Pass yds', g => g[F.pass_yd]], ['Pass TD', g => g[F.pass_td]],
       ['INT', g => g[F.pass_int]], ['Carries', g => g[F.rush_att]], ['Rush yds', g => g[F.rush_yd]]],
  RB: [['Carries', g => g[F.rush_att]], ['Rush yds', g => g[F.rush_yd]], ['Targets', g => g[F.rec_tgt]], ['Rec', g => g[F.rec]],
       ['Rec yds', g => g[F.rec_yd]], ['TD', g => g[F.rush_td] + g[F.rec_td]]],
  WR: [['Targets', g => g[F.rec_tgt]], ['Rec', g => g[F.rec]], ['Rec yds', g => g[F.rec_yd]], ['TD', g => g[F.rec_td] + g[F.rush_td]],
       ['Carries', g => g[F.rush_att]]],
};
LOG_COLS.TE = LOG_COLS.WR;
const SUMS = {QB: ['pass_yd', 'pass_td', 'pass_int', 'rush_att', 'rush_yd'], RB: ['rush_att', 'rush_yd', 'rec_tgt', 'rec', 'rec_yd'],
              WR: ['rec_tgt', 'rec', 'rec_yd', 'rush_att'], TE: ['rec_tgt', 'rec', 'rec_yd', 'rush_att']};

// ---------------------------------------------------------------- player popup: profile, ranks, ownership

const GAMES = PD.games || {};   // {team: {week: [opponent, date]}}

function teamFullName(abbr) {
  if (NBA) return NBA_TEAM_NAMES[abbr] || abbr;
  const d = P[abbr];
  return d && d.p === 'DEF' ? d.n.replace(/ D\/ST$/, '') : abbr;
}

function nextGame(team, week = D.week) {
  if (!team) return null;
  if (NBA) { const g = gamesOf(team).find(x => x[0] >= TODAY); return g ? {opp: g[1], date: g[0], home: g[2]} : null; }
  const g = (GAMES[team] || {})[String(week)];
  if (g) return {opp: g[0], date: g[1]};
  return BYES[team] === week ? {bye: true} : null;
}

function gameLabel(g) {
  if (!g) return '–';
  if (g.bye) return 'BYE';
  let s = (g.home === 0 ? '@ ' : 'vs ') + g.opp;
  if (g.date) {
    const d = new Date(g.date + 'T12:00:00');
    if (!isNaN(d)) s += ' · ' + d.toLocaleDateString([], {weekday: 'short', month: 'short', day: 'numeric'});
  }
  return s;
}

function ageFrom(bd) {
  const b = new Date(bd + 'T12:00:00');
  if (isNaN(b)) return null;
  const now = new Date();
  let a = now.getFullYear() - b.getFullYear();
  if (now.getMonth() < b.getMonth() || (now.getMonth() === b.getMonth() && now.getDate() < b.getDate())) a--;
  return a;
}

const heightText = ht => { const n = parseInt(ht, 10); return n ? `${Math.floor(n / 12)}'${n % 12}"` : null; };

// Ranks this season by PPR points scored, within each position.
let seasonRankCache = null;
function seasonRank(sid) {
  if (!seasonRankCache && NBA) {
    seasonRankCache = {};
    Object.entries(P).filter(([, p]) => p.log.length)
      .map(([id, p]) => [id, p.log.reduce((s, g) => s + nbaPoints(g.slice(2), D.scoring), 0)])
      .sort((a, b) => b[1] - a[1]).forEach(([id], i) => { seasonRankCache[id] = `#${i + 1} overall`; });
  }
  if (!seasonRankCache) {
    seasonRankCache = {};
    const byPos = {};
    Object.entries(P).forEach(([id, p]) => { if (p.log.length) (byPos[p.p] = byPos[p.p] || []).push([id, p.log.reduce((s, g) => s + g[2], 0)]); });
    Object.entries(byPos).forEach(([pos, list]) => list.sort((a, b) => b[1] - a[1]).forEach(([id], i) => { seasonRankCache[id] = posLabel(pos) + (i + 1); }));
  }
  return seasonRankCache[sid];
}

function boardRanks(sid) {
  const out = [];
  KINDS.forEach(k => Object.entries((D.types[k] || {}).rankings || {}).forEach(([pos, rows]) => {
    const r = rows.find(x => x.sid === sid);
    if (!r) return;
    if (NBA && pos === 'ALL') out.push(`${D.types[k].tab}: #${r.rank} overall`);
    else if (NBA && pos !== (P[sid] || {}).p) return;   // just overall and his main position
    else out.push(`${D.types[k].tab}: ${posLabel(pos)}${r.rank}`);
  }));
  return out;
}

function playerPhoto(sid, p) {
  const box = tint(el('div', 'pl-photo'), p.t);
  const initials = () => {
    box.replaceChildren(el('span', '', initialsOf(p.n, p.p, p.t)));
    box.classList.add('none');
  };
  const src = imageFor(sid, p.p, p.t, false);
  if (!src) { initials(); return box; }
  const img = el('img');
  img.alt = p.n;
  img.loading = 'lazy';
  img.src = src;
  img.addEventListener('error', initials);
  box.appendChild(img);
  return box;
}

function playerBio(p) {
  const b = p.b || {};
  const team = p.t ? teamFullName(p.t) : null;
  if (p.p === 'DEF') return `Team defense and special teams for the ${team}.`;
  const parts = [];
  const year = typeof b.exp === 'number' ? (b.exp === 0 ? 'Rookie' : `${ordinal(b.exp + 1)}-year`) : '';
  parts.push(`${year ? year + ' ' : ''}${NBA ? (p.el || [p.p]).join('/') : posLabel(p.p)}${team ? ` for the ${team}` : ', currently a free agent'}${b.col ? `, out of ${b.col}` : ''}.`);
  if (b.bd) {
    const d = new Date(b.bd + 'T12:00:00');
    if (!isNaN(d)) parts.push(`Born ${d.toLocaleDateString([], {month: 'long', day: 'numeric', year: 'numeric'})}.`);
  }
  if (p.i && !injuryDetail(Object.keys(P).find(k => P[k] === p), p.i)) parts.push(`Injury status: ${p.i}${b.inj ? ` (${b.inj})` : ''}.`);
  return parts.join(' ');
}

function injuryBox(sid, p) {
  if (!p.i) return null;
  const d = injuryDetail(sid, p.i);
  const box = el('div', 'injury' + (p.i === 'Questionable' ? ' q' : ''));
  const line = el('div');
  line.appendChild(el('b', '', p.i + (d && d.type ? ` · ${d.type}` : '')));
  const bits = [];
  const g = nextGame(p.t);
  if (d && d.play != null) bits.push(`estimated ${d.play}% chance to play ${NBA ? 'next game' : `in Week ${D.week}`}${g && !g.bye ? ' ' + gameLabel(g) : ''}`);
  if (d && d.ret && shortDate(d.ret)) bits.push(`expected back ${shortDate(d.ret)}`);
  if (bits.length) line.appendChild(document.createTextNode(' · ' + bits.join(' · ')));
  box.appendChild(line);
  if (d && d.note) box.appendChild(el('div', '', `${d.note}${d.upd && shortDate(d.upd) ? ` (${shortDate(d.upd)})` : ''}`));
  if (d && d.play != null && p.i !== 'Out' && p.i !== 'IR') {
    box.appendChild(el('div', 'note', 'Chance to play is an estimate from the injury designation and the latest practice report, not an official figure. Expected return is ESPN\'s.'));
  }
  return box;
}

function renderPlayerHead(sid, p) {
  const head = document.getElementById('pl-head');
  head.replaceChildren();
  head.style.removeProperty('--tc');
  tint(head, p.t);
  head.appendChild(playerPhoto(sid, p));
  const info = el('div', 'pl-info');
  const h = el('h2', '', p.n); h.id = 'pl-name';
  info.appendChild(h);
  const b = p.b || {};
  const meta = el('div', 'pl-meta');
  const chip = teamChip(p.t); if (chip) meta.appendChild(chip);
  meta.appendChild(el('span', 'desc', [posLabel(p.p), p.t ? teamFullName(p.t) : 'Free agent', b.num ? '#' + b.num : null].filter(Boolean).join(' · ')));
  const inj = injuryBadge(p.i, sid); if (inj) meta.appendChild(inj);
  info.appendChild(meta);
  info.appendChild(el('p', 'pl-bio', playerBio(p)));
  const box = injuryBox(sid, p);
  if (box) info.appendChild(box);

  const facts = el('dl', 'facts');
  const fact = (label, value) => {
    if (value === null || value === undefined || value === '') return;
    const d = el('div'); d.appendChild(el('dt', '', label)); d.appendChild(el('dd', '', String(value))); facts.appendChild(d);
  };
  if (p.p !== 'DEF') {
    fact('Age', b.bd ? ageFrom(b.bd) : null);
    fact('Height', heightText(b.ht));
    fact('Weight', b.wt ? `${b.wt} lb` : null);
    fact('Experience', typeof b.exp === 'number' ? (b.exp === 0 ? 'Rookie' : `${b.exp} yr${b.exp === 1 ? '' : 's'}`) : null);
    fact('College', b.col);
  }
  const sr = seasonRank(sid);
  if (NBA) {
    fact(`${D.season_label} so far`, sr ? `${sr} in fantasy pts` : null);
    fact('Next game', gameLabel(nextGame(p.t)));
    const wk = CAL.weeks[String(D.week)];
    if (wk) fact(`Games left in Week ${D.week}`, gamesOf(p.t).filter(g => g[0] >= TODAY && g[0] <= wk[1]).length);
  } else {
    fact(`${D.season} finish so far`, sr ? `${sr} in PPR points` : null);
    fact(`Week ${D.week}`, gameLabel(nextGame(p.t)));
  }
  fact('Rostered', p.own ? `${p.own[0]}% of ESPN leagues` : null);
  fact('Started', p.own && p.own[1] != null ? `${p.own[1]}% of ESPN leagues` : null);
  info.appendChild(facts);
  const ranks = boardRanks(sid);
  if (ranks.length) info.appendChild(el('p', 'desc', 'Rankings here: ' + ranks.join(' · ')));
  head.appendChild(info);
  const close = el('button', 'close', '×');
  close.type = 'button'; close.setAttribute('aria-label', 'Close');
  close.addEventListener('click', () => document.getElementById('plog').close());
  head.appendChild(close);
}

// ---------------------------------------------------------------- player popup: season game logs

// Past seasons live in <page>.history.js (several MB), loaded the first time a popup opens.
let historyState = window.PLAYER_HISTORY ? 'ready' : 'idle';
function loadHistory(onDone) {
  if (historyState === 'ready' || historyState === 'missing') return onDone();
  if (historyState === 'loading') { loadHistory.waiting.push(onDone); return; }
  historyState = 'loading';
  loadHistory.waiting = [onDone];
  const s = document.createElement('script');
  s.src = D.history_file || 'index.history.js';
  const finish = ok => { historyState = ok && window.PLAYER_HISTORY ? 'ready' : 'missing'; loadHistory.waiting.forEach(f => f()); };
  s.onload = () => finish(true);
  s.onerror = () => finish(false);
  document.head.appendChild(s);
}

function seasonLog(p, games, lastWeek, isCurrent, fieldIndex) {
  const box = el('div');
  const G = fieldIndex;
  const cols = (LOG_COLS[p.p] || []).map(([label, f]) => [label, g => f(remap(g, G))]);
  const gp = games.length;
  const total = games.reduce((s, g) => s + g[2], 0);
  const snaps = games.map(g => g[3]).filter(v => v !== null && v !== undefined);
  const sum = f => games.reduce((s, g) => s + (g[G[f]] || 0), 0);

  const stats = el('div', 'stats');
  const stat = (v, label) => { const s = el('div', 'stat'); s.appendChild(el('b', '', v)); s.appendChild(el('span', '', label)); stats.appendChild(s); };
  stat(String(gp), 'Games');
  stat(fmt(total), 'PPR points');
  stat(gp ? fmt(total / gp) : '–', 'PPR / game');
  if (snaps.length) stat(Math.round(snaps.reduce((a, b) => a + b, 0) / snaps.length) + '%', 'Avg snap share');
  if (['WR', 'TE', 'RB'].includes(p.p)) stat(gp ? fmt(sum('rec_tgt') / gp) : '–', 'Targets / game');
  if (['RB', 'QB'].includes(p.p)) stat(gp ? fmt(sum('rush_att') / gp) : '–', 'Carries / game');
  if (isCurrent) {
    const nextProj = p.proj[String(D.week)];
    stat(nextProj !== undefined ? fmt(nextProj) : (BYES[p.t] === D.week ? 'Bye' : '–'), `Week ${D.week} proj.`);
  }
  box.appendChild(stats);

  const byWeek = Object.fromEntries(games.map(g => [g[0], g]));
  const rows = [];
  for (let w = 1; w <= lastWeek; w++) {
    const tr = el('tr');
    tr.appendChild(td(w, 'rank'));
    const g = byWeek[w];
    if (!g) {
      const note = td(isCurrent ? (BYES[p.t] === w ? 'Bye' : 'Did not play') : 'Bye or did not play', 'l muted');
      note.colSpan = 3 + cols.length;
      tr.appendChild(note);
    } else {
      tr.appendChild(td(g[1] ? 'vs ' + g[1] : '', 'l'));
      tr.appendChild(td(fmt(g[2]), 'avg'));
      tr.appendChild(td(g[3] === null || g[3] === undefined ? '–' : g[3] + '%'));
      cols.forEach(([, f]) => tr.appendChild(td(f(g))));
    }
    rows.push(tr);
  }
  let foot = null;
  if (gp) {
    foot = el('tr');
    foot.appendChild(td('')); foot.appendChild(td('Season', 'l')); foot.appendChild(td(fmt(total)));
    foot.appendChild(td(snaps.length ? Math.round(snaps.reduce((a, b) => a + b, 0) / snaps.length) + '%' : '–'));
    const totals = {
      'Cmp/Att': `${sum('pass_cmp')}/${sum('pass_att')}`, 'Pass yds': sum('pass_yd'), 'Pass TD': sum('pass_td'), 'INT': sum('pass_int'),
      'Carries': sum('rush_att'), 'Rush yds': sum('rush_yd'), 'Targets': sum('rec_tgt'), 'Rec': sum('rec'), 'Rec yds': sum('rec_yd'),
      'TD': sum('rush_td') + sum('rec_td'),
    };
    cols.forEach(([label]) => foot.appendChild(td(totals[label] !== undefined ? totals[label] : '')));
  }
  if (lastWeek < 1) box.appendChild(el('p', 'empty', 'No games played yet this season.'));
  else box.appendChild(table([['Wk', 'rank'], ['Opp', 'l'], 'PPR', 'Snap %', ...cols.map(c => c[0])], rows, foot));
  return box;
}

// LOG_COLS read fields through F; history rows may come with their own field order.
function remap(g, G) {
  if (G === F) return g;
  const out = g.slice(0, 4);
  FIELDS.forEach((f, i) => { out[i + 4] = G[f] !== undefined ? g[G[f]] : 0; });
  return out;
}

let playerSeason = null;

// ---------------------------------------------------------------- basketball player popup: season game logs

const seasonName = s => (NBA ? `${s}-${String(+s + 1).slice(-2)}` : String(s));
const NBA_COLS = [['MIN', l => Math.round(l[FI.min] || 0)], ['PTS', l => l[FI.pts]], ['REB', l => l[FI.reb]], ['AST', l => l[FI.ast]],
  ['STL', l => l[FI.stl]], ['BLK', l => l[FI.blk]], ['3PM', l => l[FI.tpm]], ['FG', l => `${l[FI.fgm]}/${l[FI.fga]}`],
  ['FT', l => `${l[FI.ftm]}/${l[FI.fta]}`], ['TO', l => l[FI.to]]];

/** Rows are [date, opp, ...line]; past seasons store the date as MM-DD. */
function gameDate(d, season) {
  if (d.length > 5) return d;
  return `${+d.slice(0, 2) >= 8 ? season : +season + 1}-${d}`;
}

function nbaSeasonLog(p, games, season, isCurrent) {
  const box = el('div');
  const gp = games.length;
  const fp = g => nbaPoints(g.slice(2), D.scoring);
  const avg = f => (gp ? games.reduce((s, g) => s + (f(g.slice(2)) || 0), 0) / gp : null);
  const stats = el('div', 'stats');
  const stat = (v, label) => { const s = el('div', 'stat'); s.appendChild(el('b', '', v)); s.appendChild(el('span', '', label)); stats.appendChild(s); };
  stat(String(gp), 'Games');
  stat(gp ? fmt(avg(l => nbaPoints(l, D.scoring))) : '–', 'Fantasy pts / game');
  stat(gp ? fmt(avg(l => l[FI.pts])) : '–', 'Points');
  stat(gp ? fmt(avg(l => l[FI.reb])) : '–', 'Rebounds');
  stat(gp ? fmt(avg(l => l[FI.ast])) : '–', 'Assists');
  stat(gp ? fmt(avg(l => l[FI.min])) : '–', 'Minutes');
  if (isCurrent) {
    const nxt = nextGameDate(p.t);
    if (nxt) stat(fmt(nbaPoints(p.nx[nxt] || p.pg, D.scoring)), `Next game proj.`);
  }
  box.appendChild(stats);
  if (!gp) { box.appendChild(el('p', 'empty', isCurrent ? 'No games played yet this season.' : 'No games this season.')); return box; }
  const rows = games.slice().reverse().map(g => {
    const tr = el('tr');
    const d = new Date(gameDate(g[0], season) + 'T12:00:00');
    tr.appendChild(td(d.toLocaleDateString([], {month: 'short', day: 'numeric'}), 'l muted'));
    tr.appendChild(td(g[1] ? 'vs ' + g[1] : '', 'l'));
    tr.appendChild(td(fmt(fp(g)), 'avg'));
    NBA_COLS.forEach(([, f]) => tr.appendChild(td(f(g.slice(2)))));
    return tr;
  });
  const foot = el('tr');
  foot.appendChild(td('Per game', 'l')); foot.appendChild(td(''));
  foot.appendChild(td(fmt(avg(l => nbaPoints(l, D.scoring)))));
  NBA_COLS.forEach(([label]) => {
    const k = {MIN: 'min', PTS: 'pts', REB: 'reb', AST: 'ast', STL: 'stl', BLK: 'blk', '3PM': 'tpm', TO: 'to'}[label];
    if (k) foot.appendChild(td(fmt(avg(l => l[FI[k]]))));
    else {
      const [m, a] = label === 'FG' ? ['fgm', 'fga'] : ['ftm', 'fta'];
      const made = games.reduce((s, g) => s + (g[2 + FI[m]] || 0), 0), att = games.reduce((s, g) => s + (g[2 + FI[a]] || 0), 0);
      foot.appendChild(td(att ? Math.round(100 * made / att) + '%' : '–'));
    }
  });
  box.appendChild(table([['Date', 'l'], ['Opp', 'l'], 'FPTS', ...NBA_COLS.map(c => c[0])], rows, foot));
  return box;
}

const seasonFiles = {};   // season -> 'loading' | 'ready' | 'missing'
function loadSeason(season, onDone) {
  const H = window.SEASON_HISTORY || {};
  if (H[season]) return onDone();
  const file = (D.history_files || {})[season];
  if (!file || seasonFiles[season] === 'missing') { seasonFiles[season] = 'missing'; return onDone(); }
  if (seasonFiles[season] === 'loading') return;
  seasonFiles[season] = 'loading';
  const s = document.createElement('script');
  s.src = file;
  s.onload = () => { seasonFiles[season] = 'ready'; onDone(); };
  s.onerror = () => { seasonFiles[season] = 'missing'; onDone(); };
  document.head.appendChild(s);
}

function renderPlayerBodyNba(sid, p) {
  const body = document.getElementById('pl-body');
  body.replaceChildren();
  const seasons = [String(D.season), ...Object.keys(p.hs || {}).sort((a, b) => b - a)];
  if (!seasons.includes(playerSeason)) playerSeason = String(D.season);
  const bar = el('div', 'tabs');
  bar.setAttribute('role', 'group'); bar.setAttribute('aria-label', 'Season');
  tabs(bar, seasons.map(s => [s, seasonName(s)]), playerSeason, v => { playerSeason = v; renderPlayerBodyNba(sid, p); });
  body.appendChild(bar);
  const scoringNote = 'Fantasy points use ESPN standard points scoring.';
  if (playerSeason === String(D.season)) {
    body.appendChild(nbaSeasonLog(p, p.log, D.season, true));
    body.appendChild(el('p', 'foot', `${D.season_label} regular season so far, newest game first, from Sleeper box scores. ${scoringNote}`));
    return;
  }
  const season = playerSeason;
  const H = (window.SEASON_HISTORY || {})[season];
  if (!H) {
    if (seasonFiles[season] === 'missing') body.appendChild(el('p', 'note', `The ${seasonName(season)} file isn't available: run update.py to build it.`));
    else {
      body.appendChild(el('p', 'empty', `Loading ${seasonName(season)}…`));
      loadSeason(season, () => { if (playerSeason === season) renderPlayerBodyNba(sid, p); });
    }
    return;
  }
  const s = H[sid];
  if (s && s.rank) body.appendChild(el('p', 'desc', `Finished #${s.rank} overall in fantasy points in ${seasonName(season)}.`));
  body.appendChild(nbaSeasonLog(p, s ? s.log : [], season, false));
  body.appendChild(el('p', 'foot', `${seasonName(season)} regular season, newest game first, from Sleeper box scores. ${scoringNote}`));
}

function renderPlayerBody(sid, p) {
  if (NBA) return renderPlayerBodyNba(sid, p);
  const body = document.getElementById('pl-body');
  body.replaceChildren();
  const H = window.PLAYER_HISTORY;
  const past = (H && H.seasons && H.seasons[sid]) || {};
  const HF = H ? Object.fromEntries((H.fields || []).map((f, i) => [f, i + 4])) : F;
  const seasons = [String(D.season), ...Object.keys(past).sort((a, b) => b - a)];
  if (!seasons.includes(playerSeason)) playerSeason = String(D.season);

  const bar = el('div', 'tabs');
  bar.setAttribute('role', 'group'); bar.setAttribute('aria-label', 'Season');
  tabs(bar, seasons.map(s => [s, s]), playerSeason, v => { playerSeason = v; renderPlayerBody(sid, p); });
  body.appendChild(bar);

  if (playerSeason === String(D.season)) {
    body.appendChild(seasonLog(p, p.log, LAST_DONE, true, F));
    body.appendChild(el('p', 'foot', `${D.season} regular season through Week ${LAST_DONE}, from Sleeper box scores. Snap % is the share of the team's offensive snaps.`));
  } else {
    const s = past[playerSeason];
    if (s.rank) body.appendChild(el('p', 'desc', `Finished ${posLabel(s.rank.replace(/\d+$/, ''))}${s.rank.match(/\d+$/)[0]} in PPR points in ${playerSeason}.`));
    body.appendChild(seasonLog(p, s.log, +playerSeason >= 2021 ? 18 : 17, false, HF));
    body.appendChild(el('p', 'foot', `${playerSeason} regular season, from Sleeper box scores. Opponents are listed without home/away.`));
  }
  if (historyState === 'loading') body.appendChild(el('p', 'note', 'Loading past seasons…'));
  if (historyState === 'missing') body.appendChild(el('p', 'note', 'Past seasons aren\'t available: run update.py to build them.'));
}

function openPlayer(sid, push = true) {
  const p = P[sid];
  if (!p) return;
  const dlg = document.getElementById('plog');
  playerSeason = String(D.season);
  renderPlayerHead(sid, p);
  renderPlayerBody(sid, p);
  if (!dlg.open) dlg.showModal();
  if (push) setHash({player: sid});
  if (!NBA) loadHistory(() => { if (dlg.open && readHash().player === sid) renderPlayerBody(sid, p); });
}

function readHash() {
  const out = {};
  location.hash.replace(/^#/, '').split('&').filter(Boolean).forEach(part => {
    const [k, v] = part.split('=');
    if (v === undefined) out.view = k; else out[k] = decodeURIComponent(v);
  });
  return out;
}

function setHash(changes) {
  const h = Object.assign(readHash(), {view}, changes);
  let s = '#' + h.view;
  if (h.view === 'league' && h.sub) s += '&sub=' + encodeURIComponent(h.sub);
  if (h.player) s += '&player=' + encodeURIComponent(h.player);
  try { history.replaceState(null, '', s); } catch (e) { /* some file:// contexts disallow it */ }
}

function show(v) {
  view = ['slate', 'league', 'games'].includes(v) ? v : 'rankings';
  ['rankings', 'slate', 'league', 'games'].forEach(k => {
    document.getElementById('nav-' + k).setAttribute('aria-selected', String(view === k));

}

/** "vs KC" for the upcoming week (football), or every opponent left this week (basketball). */
function weekOpponents(team) {
  if (!team) return null;
  if (NBA) {
    const wk = CAL.weeks[String(D.week)];
    const opps = wk ? gamesOf(team).filter(g => g[0] >= TODAY && g[0] <= wk[1]).map(g => g[1]) : [];
    return opps.length ? 'vs ' + opps.join(', ') : 'No games';
  }

  body.replaceChildren();

  if (!rows.length) {

// ---------------------------------------------------------------- leagues: loading and normalising
//
// Every platform is turned into the same shape:
//   {key, platform, name, slots: [slot...], teams: [{id, name, owner, players: [pl], current: [{slot, pl}]}],
//    schedule: [{week, a, b, ap, bp}], regWeeks: [week...], playoffTeams, myTeam}
//   pl = {sid, name, pos, team, inj}

const SLOT_ELIG = NBA
  ? {PG: ['PG'], SG: ['SG'], SF: ['SF'], PF: ['PF'], C: ['C'], G: ['PG', 'SG'], F: ['SF', 'PF'], UTIL: ['PG', 'SG', 'SF', 'PF', 'C'],
     'SG/SF': ['SG', 'SF'], 'G/F': ['PG', 'SG', 'SF', 'PF'], 'PF/C': ['PF', 'C'], 'F/C': ['SF', 'PF', 'C']}
  : {QB: ['QB'], RB: ['RB'], WR: ['WR'], TE: ['TE'], K: ['K'], DEF: ['DEF'], FLEX: ['RB', 'WR', 'TE'],
     WRRB_FLEX: ['RB', 'WR'], REC_FLEX: ['WR', 'TE'], SUPER_FLEX: ['QB', 'RB', 'WR', 'TE']};
/** Can this player fill this lineup slot? Basketball players can be eligible at several positions. */
function eligible(pl, slot) { const e = SLOT_ELIG[slot]; return !!e && (pl.el || [pl.pos]).some(p => e.includes(p)); }
const SLOT_LABEL = {FLEX: 'FLEX', WRRB_FLEX: 'RB/WR', REC_FLEX: 'WR/TE', SUPER_FLEX: 'SUPERFLEX', DEF: 'D/ST'};
const BENCH = new Set(['BN', 'IR', 'TAXI']);
const UNAVAILABLE = new Set(['Out', 'IR', 'Doubtful', 'PUP', 'Sus', 'NA']);

const ESPN_SLOTS = {0: 'QB', 2: 'RB', 3: 'WRRB_FLEX', 4: 'WR', 5: 'REC_FLEX', 6: 'TE', 7: 'SUPER_FLEX', 16: 'DEF', 17: 'K', 23: 'FLEX'};
const ESPN_SLOT_ORDER = [0, 2, 4, 6, 23, 3, 5, 7, 16, 17];
const ESPN_POS = {1: 'QB', 2: 'RB', 3: 'WR', 4: 'TE', 5: 'K', 16: 'DEF'};
const ESPN_TEAMS = {1: 'ATL', 2: 'BUF', 3: 'CHI', 4: 'CIN', 5: 'CLE', 6: 'DAL', 7: 'DEN', 8: 'DET', 9: 'GB', 10: 'TEN', 11: 'IND',
  12: 'KC', 13: 'LV', 14: 'LAR', 15: 'MIA', 16: 'MIN', 17: 'NE', 18: 'NO', 19: 'NYG', 20: 'NYJ', 21: 'PHI', 22: 'ARI', 23: 'PIT',
  24: 'LAC', 25: 'SF', 26: 'SEA', 27: 'TB', 28: 'WAS', 29: 'CAR', 30: 'JAX', 33: 'BAL', 34: 'HOU'};
const ESPN_INJ = {QUESTIONABLE: 'Questionable', DOUBTFUL: 'Doubtful', OUT: 'Out', INJURY_RESERVE: 'IR', SUSPENSION: 'Sus'};

function sleeperPlayer(sid) {
  const p = P[sid];
  if (p) return {sid, name: p.n, pos: p.p, el: p.el, team: p.t, inj: p.i};
  return {sid: null, name: `Player #${sid}`, pos: '', team: '', inj: null};
}

function parseSleeper(bundle) {
  const {league, users, rosters, matchups, me} = bundle;
  const st = league.settings || {};
  const allSlots = league.roster_positions || [];
  const startSlots = allSlots.filter(s => !BENCH.has(s));
  const userById = Object.fromEntries((users || []).map(u => [u.user_id, u]));
  const teams = (rosters || []).map(r => {
    const u = userById[r.owner_id] || {};
    const current = startSlots.map((slot, i) => {
      const sid = (r.starters || [])[i];
      return {slot, pl: sid && sid !== '0' ? sleeperPlayer(sid) : null};
    });
    return {
      id: r.roster_id,
      name: (u.metadata || {}).team_name || u.display_name || `Team ${r.roster_id}`,
      owner: u.display_name || '',
      players: (r.players || []).map(sleeperPlayer),
      current,
      mine: !!me && (r.owner_id === me || (r.co_owners || []).includes(me)),
    };
  });
  const start = st.start_week || 1;
  const end = (st.playoff_week_start || 15) - 1;
  const regWeeks = []; for (let w = start; w <= end; w++) regWeeks.push(w);
  const schedule = [];
  regWeeks.forEach(w => {
    const groups = {};
    (matchups[String(w)] || []).forEach(m => { if (m.matchup_id != null) (groups[m.matchup_id] = groups[m.matchup_id] || []).push(m); });
    Object.values(groups).forEach(g => {
      if (g.length === 2) schedule.push({week: w, a: g[0].roster_id, b: g[1].roster_id, ap: g[0].points || 0, bp: g[1].points || 0});
    });
  });
  const out = {
    platform: 'Sleeper', name: league.name, slots: startSlots, teams, schedule, regWeeks,
    playoffTeams: st.playoff_teams || 6, myTeam: (teams.find(t => t.mine) || {}).id,
  };
  if (NBA) {
    out.scoring = league.scoring_settings || D.scoring;
    out.weekDates = Object.fromEntries(Object.entries(CAL.weeks).map(([w, [a, b]]) => [w, datesBetween(a, b)]));
    out.curWeek = D.week;
  }
  return out;
}

function parseEspn(raw, myTeam) {
  const settings = raw.settings || {};
  const counts = (settings.rosterSettings || {}).lineupSlotCounts || {};
  const slots = [];
  ESPN_SLOT_ORDER.forEach(id => { for (let i = 0; i < (counts[id] || 0); i++) slots.push(ESPN_SLOTS[id]); });
  const members = Object.fromEntries((raw.members || []).map(m => [m.id, m.displayName]));
  const ids = PD.espn_ids || {};
  const keys = PD.keys || {};

  const teams = (raw.teams || []).map(t => {
    const players = [], current = [];
    ((t.roster || {}).entries || []).forEach(e => {
      const info = (e.playerPoolEntry || {}).player || {};
      const pos = ESPN_POS[info.defaultPositionId] || '';
      const team = ESPN_TEAMS[info.proTeamId] || '';
      const sid = pos === 'DEF' ? (P[team] ? team : null) : (ids[String(e.playerId)] || keys[normName(info.fullName || '') + '|' + pos] || null);
      const inj = ESPN_INJ[info.injuryStatus] || (sid && P[sid] ? P[sid].i : null);
      const pl = {sid, name: sid && P[sid] ? P[sid].n : (info.fullName || `Player #${e.playerId}`), pos, team, inj};
      players.push(pl);
      const slot = ESPN_SLOTS[e.lineupSlotId];
      if (slot) current.push({slot, pl});
    });
    // Line the current starters up against the league's slot order.
    const pool = current.slice();
    const aligned = slots.map(slot => {
      const i = pool.findIndex(c => c.slot === slot);
      return {slot, pl: i >= 0 ? pool.splice(i, 1)[0].pl : null};
    });
    const owner = members[t.primaryOwner] || members[(t.owners || [])[0]] || '';
    return {id: t.id, name: t.name || `${t.location || ''} ${t.nickname || ''}`.trim() || t.abbrev || `Team ${t.id}`, owner, players, current: aligned};
  });

  const sched = settings.scheduleSettings || {};
  const periods = sched.matchupPeriods || {};
  const weekOf = mp => ((periods[String(mp)] || [])[0]) || mp;
  const regPeriods = sched.matchupPeriodCount || Math.max(0, ...(raw.schedule || []).map(m => m.matchupPeriodId));
  const regWeeks = []; for (let mp = 1; mp <= regPeriods; mp++) regWeeks.push(weekOf(mp));
  const schedule = (raw.schedule || [])
    .filter(m => m.home && m.away && m.away.teamId != null && m.matchupPeriodId <= regPeriods)
    .map(m => ({week: weekOf(m.matchupPeriodId), a: m.home.teamId, b: m.away.teamId, ap: m.home.totalPoints || 0, bp: m.away.totalPoints || 0}));
  return {
    platform: 'ESPN', name: settings.name || `ESPN league ${raw.id}`, slots, teams, schedule, regWeeks,
    playoffTeams: sched.playoffTeamCount || 4, myTeam,
  };
}

async function getJSON(url) {
  let resp;
  try { resp = await fetch(url, {credentials: 'omit'}); }
  catch (e) { throw new Error('Could not reach the server. Check your connection.'); }
  if (resp.status === 401 || resp.status === 403) { const err = new Error('private'); err.status = resp.status; throw err; }
  if (!resp.ok) throw new Error(`Request failed (${resp.status}).`);
  return resp.json();
}

const SLEEPER = 'https://api.sleeper.app/v1';
async function loadSleeper(leagueId) {
  const [league, users, rosters] = await Promise.all([
    getJSON(`${SLEEPER}/league/${leagueId}`), getJSON(`${SLEEPER}/league/${leagueId}/users`), getJSON(`${SLEEPER}/league/${leagueId}/rosters`),
  ]);
  const st = league.settings || {};
  const weeks = []; for (let w = st.start_week || 1; w < (st.playoff_week_start || 15); w++) weeks.push(w);
  const lists = await Promise.all(weeks.map(w => getJSON(`${SLEEPER}/league/${leagueId}/matchups/${w}`).catch(() => [])));
  const matchups = Object.fromEntries(weeks.map((w, i) => [String(w), lists[i]]));
  return parseSleeper({league, users, rosters, matchups, me: (store.get().sleeper || {}).user_id});
}

const ESPN_VIEWS = ['mSettings', 'mTeam', 'mRoster', 'mMatchupScore'];
async function loadEspn(leagueId, myTeam) {
  const game = NBA ? `fba/seasons/${D.espn_season}` : `ffl/seasons/${D.season}`;
  const url = `https://lm-api-reads.fantasy.espn.com/apis/v3/games/${game}/segments/0/leagues/${leagueId}?` +
    ESPN_VIEWS.map(v => 'view=' + v).join('&');
  try {
    return (NBA ? parseEspnNba : parseEspn)(await getJSON(url), myTeam);
  } catch (e) {
    if (e.message === 'private') throw new Error('This ESPN league is private. Run python3 update.py --espn-login in the project folder to sign in to ESPN and add it.');
    throw e;
  }
}
